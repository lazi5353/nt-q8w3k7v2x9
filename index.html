<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Hasta Takip</title>
<style>
:root{--p:#0f6b8a;--p2:#e6f3f7;--bg:#f3f5f7;--card:#fff;--t:#17212b;--m:#667788;--red:#d23b3b;--grn:#1f8f4e;--org:#d98a00;--line:#e1e6ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
#app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;min-height:52px}
header.top h1{font-size:18px;margin:0;flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:7px 11px;font-size:15px}
main{padding:12px}
h2{font-size:15px;color:var(--m);margin:18px 2px 8px;text-transform:uppercase;letter-spacing:.3px}
h3{margin:0 0 10px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card.alert{border-left:4px solid var(--org)}
.card.danger{border-left:4px solid var(--red)}
.item{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.qty{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.qty>div{font-size:20px;font-weight:700}
.muted{color:var(--m);font-size:14px}
.red{color:var(--red)}.grn{color:var(--grn)}.org{color:var(--org)}
.big{font-size:26px;font-weight:700}
.empty{color:var(--m);text-align:center;padding:14px;font-size:14px}
label{display:block;font-size:14px;color:var(--m);margin:8px 0 0}
input,select,textarea{display:block;width:100%;font:inherit;color:var(--t);padding:10px;border:1px solid #cfd8de;border-radius:9px;background:#fff;margin-top:4px;min-height:44px}
input[type=checkbox]{display:inline-block;width:22px;height:22px;min-height:0;margin:0 8px 0 0;vertical-align:middle}
label.chk{display:flex;align-items:center;color:var(--t);font-size:16px;margin:12px 0 4px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{display:inline-block;background:var(--p);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;text-align:center;min-height:44px}
.btn.gray{background:#e3e8ec;color:var(--t)}.btn.red{background:var(--red)}.btn.grn{background:var(--grn)}
.btn.sm{padding:6px 10px;font-size:14px;min-height:34px}
.btn.full{display:block;width:100%;margin-bottom:10px}
.btn.bigbtn{font-size:18px;padding:15px}
.btns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
.chip{border:1px solid #bcc9d1;background:#fff;color:var(--t);border-radius:20px;padding:8px 13px;font:inherit;font-size:15px;min-height:40px}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.chip small{opacity:.7;margin-left:4px}
.seg{display:flex;background:#e3e8ec;border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:8px;font:inherit;font-size:14px;color:var(--t)}
.seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.badge{display:inline-block;font-size:12px;border-radius:10px;padding:2px 8px;background:#eef1f3;color:var(--m);margin-left:4px}
.badge.red{background:#fde8e8;color:var(--red)}.badge.org{background:#fff1d6;color:var(--org)}.badge.grn{background:#e0f4e8;color:var(--grn)}
.note{background:var(--p2);border-radius:9px;padding:9px 11px;font-size:14px;margin:8px 0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:18px;border:1px solid #bcc9d1;background:#fff;font-size:20px;line-height:1}
.tb{width:100%;border-collapse:collapse;font-size:15px}
.tb td,.tb th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
.tb .r,.tb th.r{text-align:right}
.tb tr.hd td{font-weight:700;color:var(--m);font-size:13px;text-transform:uppercase;padding-top:12px}
.tb tr.tot td{font-weight:700}
.tb tr.sub td{color:var(--m);font-size:14px}
.tb tr.click{cursor:pointer}
.chart{display:flex;gap:2px;margin-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center}
.up{height:58px;display:flex;align-items:flex-end}.dn{height:58px;display:flex;align-items:flex-start}
.col i{display:block;width:13px;background:var(--grn);border-radius:3px}.col i.neg{background:var(--red)}
.col small{font-size:10px;color:var(--m)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;border:0;background:transparent;padding:7px 0 6px;font:inherit;font-size:11px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs button span{font-size:20px;line-height:1.2}
nav.tabs button.on{color:var(--p);font-weight:700}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;overflow:auto;padding:14px;-webkit-overflow-scrolling:touch}
#modal.on{display:block}
#modal .box{background:#fff;border-radius:14px;padding:16px;max-width:560px;margin:14px auto}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;display:none;max-width:90%;text-align:center}
img.prev{max-width:100%;border-radius:8px;display:block;margin:0 auto}
a.tel{color:var(--p);text-decoration:none;font-weight:600}
.sum{background:var(--p2)}
.hb2{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.hb2 .hl{flex:0 0 36%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb2 .ht{flex:1;background:#eef1f3;border-radius:5px;height:12px;overflow:hidden}.hb2 .ht i{display:block;height:100%;background:var(--p);border-radius:5px}.hb2 .ht i.neg{background:var(--red)}
.hb2 .hv{flex:0 0 auto;min-width:70px;text-align:right;color:var(--m);font-size:13px}
.sum .tb td{border-color:#cfe3ea}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs">
<button data-act="tab" data-p="home" data-k="home"><span>🏠</span>Ana</button>
<button data-act="tab" data-p="patients" data-k="patients"><span>👥</span>Hastalar</button>
<button data-act="tab" data-p="stock" data-k="stock"><span>💊</span>Depo</button>
<button data-act="tab" data-p="lab" data-k="lab"><span>🧪</span>Lab</button>
<button data-act="tab" data-p="fin" data-k="fin"><span>📊</span>Maliye</button>
<button data-act="tab" data-p="more" data-k="more"><span>⚙️</span>Daha</button>
</nav>
<div id="modal"></div>
<div id="toast"></div>

<script>
'use strict';
/* ============ Yardımcılar ============ */
const VERSION='2.5';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+n));};
const dayDiff=(a,b)=>{const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);};return Math.round((p(b)-p(a))/86400000);};
const fd=s=>s?s.split('-').reverse().join('.'):'';
const round2=n=>Math.round(n*100)/100;
const MN=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const MS=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
function num(x){
  if(typeof x==='number') return isFinite(x)?x:0;
  let s=String(x==null?'':x).trim().replace(/\s/g,'');
  if(!s) return 0;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=parseFloat(s); return isFinite(n)?n:0;
}
const ns=n=>(n==null||n==='')?'':(typeof n==='string'?n:String(n).replace('.',','));
const fmt=new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',minimumFractionDigits:0,maximumFractionDigits:2});
const money=n=>fmt.format(round2(num(n)));
const lc=s=>String(s||'').toLocaleLowerCase('tr');
// İlaç dozu: adet = depodan düşen (tam ampul), uyg = hastaya uygulanan (örn. 0,5)
const FRS={0.25:'¼',0.5:'½',0.75:'¾'};
function fmtDoz(n){n=round2(num(n));const w=Math.floor(n+1e-9),f=round2(n-w);if(!f)return String(w);return FRS[f]?(w?w:'')+FRS[f]:ns(n);}
const dozFrac=i=>i.uyg!=null?round2(i.uyg-(i.adet-1)):null;
const itemTxt=i=>i.uyg!=null&&i.uyg!==i.adet?`${esc(i.ad)} ${fmtDoz(i.uyg)} (depodan ${i.adet})`:`${esc(i.ad)}${i.adet!==1?' ×'+i.adet:''}`;
function addDoz(list,ad,adet,uyg){
  const u=uyg!=null?uyg:adet;let it=list.find(i=>lc(i.ad)===lc(ad));
  if(it){it.uyg=round2((it.uyg!=null?it.uyg:it.adet)+u);it.adet+=adet;}else{it={ad,adet,uyg:u};list.push(it);}
  if(it.uyg===it.adet)delete it.uyg;
}
function ageOf(d){if(!d)return '';const t=new Date(),[y,m,dd]=d.split('-').map(Number);let a=t.getFullYear()-y;if(t.getMonth()+1<m||(t.getMonth()+1===m&&t.getDate()<dd))a--;return a;}
function validTC(t){
  if(!/^\d{11}$/.test(t)||t[0]==='0') return false;
  const d=t.split('').map(Number);
  const d10=(((d[0]+d[2]+d[4]+d[6]+d[8])*7)-(d[1]+d[3]+d[5]+d[7]))%10;
  const d11=d.slice(0,10).reduce((a,b)=>a+b,0)%10;
  return ((d10+10)%10)===d[9]&&d11===d[10];
}
let toastT;
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',3200);}

/* ============ Veritabanı (IndexedDB) ============ */
let db;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('hastatakip',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('files');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const tx=(s,m)=>db.transaction(s,m).objectStore(s);
const kvGet=k=>rq(tx('kv','readonly').get(k));
const kvSet=(k,v)=>rq(tx('kv','readwrite').put(v,k));
const fGet=id=>rq(tx('files','readonly').get(id));
const fPut=(id,b)=>rq(tx('files','readwrite').put(b,id));
const fDel=id=>rq(tx('files','readwrite').delete(id));
const fClear=()=>rq(tx('files','readwrite').clear());
let saving=Promise.resolve();
function save(){saving=saving.then(()=>kvSet('state',S)).catch(e=>alert('Kaydedilemedi! '+e));return saving;}

/* ============ Başlangıç verisi ============ */
function defaults(){
  const st=(id,ad,tip)=>({id,ad,tip,adet:0,birim:0,minAdet:0,skt:''});
  return {
    v:1,patients:[],visits:[],plans:[],calls:[],files:[],purchases:[],expenses:[],nurses:[],extPay:[],adj:[],
    tests:[],testGroups:[],accounts:[{id:'h_nakit',ad:'Nakit',tip:'nakit'},{id:'h_kisisel',ad:'Kişisel kart / cebimden',tip:'kisisel'}],catRules:[],notDup:[],balAdj:[],transfers:[],
    stock:[
      st('sr_iz250','İzotonik 250','serum'),st('sr_iz500','İzotonik 500','serum'),
      st('sr_rl250','Ringer Laktat 250','serum'),st('sr_rl500','Ringer Laktat 500','serum'),
      st('sr_dek','Dekstroz','serum'),st('sr_izo','İzolen','serum'),
      st('st_set','Serum seti','malzeme'),st('st_enj','Enjektör','malzeme'),st('st_intra','İntraket','malzeme'),
      st('st_flaster','Flaster','malzeme'),st('st_probe','Ateş ölçer probu','malzeme'),st('st_strip','Kan şekeri stripi','malzeme')
    ],
    services:[
      {id:'s_serum',ad:'Serum',tip:'serum',ucret:0,malz:[{id:'st_set',adet:1},{id:'st_enj',adet:1},{id:'st_intra',adet:1},{id:'st_flaster',adet:1}]},
      {id:'s_ates',ad:'Ateş ölçme',tip:'normal',ucret:0,malz:[{id:'st_probe',adet:1}]},
      {id:'s_seker',ad:'Kan şekeri',tip:'normal',ucret:0,malz:[{id:'st_strip',adet:1}]},
      {id:'s_enj',ad:'Enjeksiyon / ilaç uygulaması',tip:'normal',ucret:0,malz:[{id:'st_enj',adet:1}]},
      {id:'s_lab',ad:'Laboratuvar',tip:'lab',ucret:0,malz:[]}
    ],
    expCats:['Yakıt','Araç bakım','Eczane (ilaç dışı)','Avukatlık ücreti','Diğer'],
    settings:{lastBackup:null,sinceBackup:0,sktDays:30,labK:1.1,satK:6}
  };
}
function ensureShape(s){const d=defaults();Object.keys(d).forEach(k=>{if(s[k]===undefined)s[k]=d[k];});Object.keys(d.settings).forEach(k=>{if(s.settings[k]===undefined)s.settings[k]=d.settings[k];});return s;}

/* ============ Hesaplar ============ */
function isNurse(v){return v.kim&&v.kim!=='ben';}
function visitCalc(v){
  if(v.eski||v.elle){const m=num(v.maliyet),u=num(v.ucret);return {itemCost:0,labCost:0,nurseFee:0,eski:v.eski?m:0,elle:v.eski?0:m,maliyet:m,kar:u-m,borc:Math.max(0,round2(u-num(v.odenen)))};}
  const nurse=isNurse(v);
  const itemCost=nurse?0:(v.items||[]).reduce((a,i)=>a+num(i.adet)*num(i.birim),0);
  const labCost=(v.tests||[]).reduce((a,t)=>a+num(t.maliyet),0);
  const nurseFee=nurse?num(v.hemsireUcret):0;
  const maliyet=itemCost+labCost+nurseFee;
  const ucret=num(v.ucret);
  return {itemCost,labCost,nurseFee,eski:0,elle:0,maliyet,kar:ucret-maliyet,borc:Math.max(0,round2(ucret-num(v.odenen)))};
}
function allCats(){const c=[...S.expCats];S.expenses.forEach(e=>{if(!c.includes(e.kategori))c.push(e.kategori);});return c;}
function periodStats(y,m){
  const inP=d=>{if(!d)return false;const yy=+d.slice(0,4),mm=+d.slice(5,7)-1;return yy===y&&(m==null||mm===m);};
  const r={n:0,ucret:0,odenen:0,ilac:0,lab:0,hems:0,eski:0,elle:0,labBorc:0,gc:{},giderTop:0,alim:0,adjC:0,adjM:0,infoHems:0,infoLab:0};
  let ucretV=0;
  S.visits.filter(v=>inP(v.tarih)).forEach(v=>{
    const c=visitCalc(v);r.n++;ucretV+=num(v.ucret);r.odenen+=num(v.odenen);
    r.ilac+=c.itemCost;r.lab+=c.labCost;r.hems+=c.nurseFee;r.eski+=c.eski;r.elle+=c.elle;
    if(c.labCost>0&&!v.labOdendi)r.labBorc+=c.labCost;
  });
  allCats().forEach(c=>r.gc[c]=0);
  S.expenses.filter(e=>inP(e.tarih)).forEach(e=>{r.gc[e.kategori]=(r.gc[e.kategori]||0)+num(e.tutar);r.giderTop+=num(e.tutar);});
  S.purchases.filter(p=>inP(p.tarih)).forEach(p=>r.alim+=num(p.tutar));
  S.extPay.filter(e=>inP(e.tarih)).forEach(e=>{
    const t=num(e.tutar);
    if(e.tip==='hemsire'){if(e.dahil)r.infoHems+=t;else r.hems+=t;}
    else{if(e.dahil)r.infoLab+=t;else r.lab+=t;}
  });
  S.adj.filter(a=>inP(a.tarih)).forEach(a=>{r.adjC+=num(a.ciro);r.adjM+=num(a.maliyet);});
  r.ucret=ucretV+r.adjC;
  r.borc=ucretV-r.odenen;
  r.visitCost=r.ilac+r.lab+r.hems+r.eski+r.elle;
  r.tmal=r.visitCost+r.giderTop+r.adjM;
  r.net=r.ucret-r.tmal;
  r.cek=0;(S.transfers||[]).forEach(tr=>{if(inP(tr.tarih)&&isOwnerOut(tr)){const f=accById(tr.from);if(!f||f.tip!=='kisisel')r.cek+=num(tr.tutar);}});
  return r;
}
function applyStock(v,sign){
  if(isNurse(v)||v.eski)return;
  (v.items||[]).forEach(i=>{const s=S.stock.find(x=>x.id===i.id);if(s)s.adet=round2(num(s.adet)+sign*num(i.adet));});
}

/* ============ Durum ve gezinme ============ */
let S,R={page:'home'},H=[],V=null,MF=null,PK=null,SD=null,BK=null,P={tab:'visits'},GD=null,LX=null,VQ='';
const pname=p=>p?((p.ad||'')+' '+(p.soyad||'')).trim():'(silinmiş hasta)';
const patient=id=>S.patients.find(p=>p.id===id);
const TABMAP={home:'home',patients:'patients',patient:'patients',visit:'patients',stock:'stock',lab:'lab',fin:'fin',more:'more',expenses:'more',nurses:'more',services:'more',backup:'more',import:'more',dups:'patients',debts:'home',recent:'home',analysis:'more',tpls:'more',accounts:'fin',account:'fin',cardimp:'fin'};

function render(keep){
  let pg;
  switch(R.page){
    case 'home':pg=pHome();break;case 'patients':pg=pPatients();break;case 'patient':pg=pPatient();break;
    case 'visit':pg=pVisit();break;case 'stock':pg=pStock();break;case 'lab':pg=pLab();break;
    case 'fin':pg=pFin();break;case 'more':pg=pMore();break;case 'expenses':pg=pExpenses();break;
    case 'nurses':pg=pNurses();break;case 'services':pg=pServices();break;case 'backup':pg=pBackup();break;case 'import':pg=pImport();break;
    case 'dups':pg=pDups();break;case 'debts':pg=pDebts();break;case 'recent':pg=pRecent();break;case 'analysis':pg=pAnalysis();break;
    case 'tpls':pg=pTpls();break;case 'accounts':pg=pAccounts();break;case 'account':pg=pAccount();break;case 'cardimp':pg=pCardImp();break;
    default:pg=pHome();
  }
  $('#app').innerHTML=`<header class="top">${pg.back?'<button class="hb" data-act="back">‹ Geri</button>':''}<h1>${esc(pg.t)}</h1>${pg.right||''}</header><main>${pg.h}</main>`;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===TABMAP[R.page]));
  if(R.page==='visit')vRefresh();
  if(!keep)window.scrollTo(0,0);
}
function modal(html){const m=$('#modal');m.innerHTML=`<div class="box">${html}</div>`;m.classList.add('on');}
function closeModal(){$('#modal').classList.remove('on');$('#modal').innerHTML='';MF=null;PK=null;SD=null;GD=null;}

/* ============ Genel form penceresi ============ */
function fieldHtml(f){
  const id='f_'+f.k,val=f.value==null?'':f.value;
  if(f.type==='check')return `<label class="chk"><input type="checkbox" id="${id}" ${val?'checked':''}> ${esc(f.label)}</label>`;
  let c;
  if(f.type==='select')c=`<select id="${id}">${f.options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(val)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  else if(f.type==='area')c=`<textarea id="${id}" rows="3">${esc(val)}</textarea>`;
  else{
    const t={date:'date',time:'time'}[f.type]||'text';
    const im=f.type==='num'?'inputmode="decimal"':f.type==='tel'?'inputmode="tel"':f.type==='tc'?'maxlength="20"':'';
    c=`<input id="${id}" type="${t}" ${im} value="${esc(val)}" placeholder="${esc(f.ph||'')}" autocomplete="off">`;

// Arama: ad, TC, telefon, adres ve notlarda; büyük/küçük harf ve Türkçe karakter fark etmez (göktürk = Göktürk = gokturk)
function plist(q,mode){
  const ws=fold(q||'').split(/\s+/).filter(Boolean);
  const VI=vIndex(),planSet=new Set(S.plans.filter(x=>!x.done).map(x=>x.patientId));
  const info=new Map();
  let L=S.patients.filter(p=>!ws.length||(h=>ws.every(w=>h.includes(w)))(fold([pname(p),p.tc,p.tel,p.adres,p.not].join(' '))));
  L.forEach(p=>{const vs=VI.get(p.id)||[];info.set(p.id,{last:vs.reduce((m,v)=>v.tarih>m?v.tarih:m,''),borc:vs.reduce((a,v)=>a+visitCalc(v).borc,0),n:vs.length});});
  const so=mode==='pick'?'az':(R.ps||'az');
  if(so==='son')L.sort((a,b)=>info.get(b.id).last.localeCompare(info.get(a.id).last));
  else if(so==='borc'){L=L.filter(p=>info.get(p.id).borc>0);L.sort((a,b)=>info.get(b.id).borc-info.get(a.id).borc);}
  else L.sort((a,b)=>pname(a).localeCompare(pname(b),'tr'));
  if(!L.length)return '<div class="empty">Hasta bulunamadı</div>';
  const lim=300,more=L.length-lim;
  const addrHit=p=>ws.length&&p.adres&&ws.some(w=>fold(p.adres).includes(w))&&!ws.every(w=>fold(pname(p)).includes(w));
  return (ws.length?`<div class="muted" style="margin:0 2px 8px">${L.length} hasta bulundu</div>`:'')+L.slice(0,lim).map(p=>{
    const x=info.get(p.id);
    const act=mode==='pick'?'data-act="pk-sel"':'data-act="go" data-p="patient"';
    return `<div class="card item" ${act} data-id="${p.id}"><div class="grow"><b>${esc(pname(p))}</b>${planSet.has(p.id)?'<span class="badge">📅 plan</span>':''}${x.borc>0?`<span class="badge red">borç ${money(x.borc)}</span>`:''}<div class="muted">${x.last?'Son ziyaret: '+fd(x.last)+' · '+x.n+' ziyaret':'Henüz ziyaret yok'}${p.tel?' · '+esc(p.tel):''}</div>${addrHit(p)?`<div class="muted">📍 ${esc(String(p.adres).slice(0,80))}</div>`:''}</div><div class="muted">›</div></div>`;
  }).join('')+(more>0?`<div class="empty">+${more} hasta daha. Aramayı daraltmak için yaz.</div>`:'');
}

function patForm(p,after){
  openForm({
    title:p?'Hasta bilgilerini düzenle':'Yeni hasta',
    fields:[
      {k:'ad',label:'Ad',value:p&&p.ad},{k:'soyad',label:'Soyad',value:p&&p.soyad},
      {k:'dogum',label:'Doğum tarihi',type:'date',value:p&&p.dogum},
      {k:'tc',label:'TC / YKN / Pasaport no',type:'tc',value:p&&p.tc},
      {k:'tel',label:'Telefon',type:'tel',value:p&&p.tel},
      {k:'adres',label:'Ev adresi',type:'area',value:p&&p.adres},
      {k:'not',label:'Önemli notlar (alerji, kronik hastalık vb.)',type:'area',value:p&&p.not}
    ],
    onSave:v=>{
      if(!v.ad){toast('Ad yazmalısın');return false;}
      if(v.tc&&/^[1-8]\d{10}$/.test(v.tc)&&!validTC(v.tc)&&!confirm('TC kimlik numarası geçersiz görünüyor. Yine de kaydedilsin mi?'))return false;

      let o=p;

      save();render(true);if(after)after(o);

function pHome(){
  const t=today(),y=+t.slice(0,4),m=+t.slice(5,7)-1;

  let h='';
  if(S.patients.length===0)h+=`<div class="note"><b>Hoş geldin.</b> Önce <b>Depo</b> sayfasında ilaç ve malzemelerini (birim maliyetleriyle), <b>Lab</b> sayfasında tahlil fiyatlarını gir. Gerçek hastaları girmeden birkaç gün <b>sahte kayıtlarla</b> dene.</div>`;
  const ls=S.settings.lastBackup;
  if(S.patients.length>0){
    const days=ls?dayDiff(ls.slice(0,10),t):null;
    if(ls==null)h+=`<div class="card danger"><b>Henüz yedek almadın.</b><div class="muted">Telefon bozulursa veya uygulama silinirse veriler gider.</div><button class="btn sm" style="margin-top:8px" data-act="go" data-p="backup">Yedek al</button></div>`;
    else if(days>=7||S.settings.sinceBackup>=5)h+=`<div class="card alert"><b>Yedek zamanı.</b><div class="muted">Son yedek ${days} gün önce, o zamandan beri ${S.settings.sinceBackup} yeni ziyaret.</div><button class="btn sm" style="margin-top:8px" data-act="go" data-p="backup">Yedek al</button></div>`;
  }
  h+=`<button class="btn full bigbtn" data-act="newVisitPick">+ Yeni ziyaret kaydı</button>`;
  // kalan borç (tüm zamanlar)
  const dl=debtList(),dtot=dl.reduce((a,x)=>a+x.borc,0);
  if(S.visits.length)h+=`<div class="card ${dtot>0?'danger':''} item" data-act="go" data-p="debts"><div class="grow"><div class="muted">💰 Hastalardan kalan alacak</div><div class="big ${dtot>0?'red':''}" style="font-size:22px">${money(dtot)}</div><div class="muted">${dl.length?dl.length+' hasta borçlu':'Borçlu hasta yok'}</div></div><div class="muted">›</div></div>`;
  // aramalar
  const calls=S.calls.filter(c=>!c.done&&c.tarih<=t).sort((a,b)=>a.tarih.localeCompare(b.tarih));
  h+=section('📞 Aranacak hastalar',calls.map(c=>{
    const p=patient(c.patientId),late=dayDiff(c.tarih,t);
    return `<div class="card danger item"><div class="grow" data-act="go" data-p="patient" data-id="${c.patientId}"><b>${esc(pname(p))}</b><div class="muted">${late>0?late+' gün gecikti':'Bugün aranacak'} · ${esc(c.neden||'ziyaret sonrası kontrol')}</div>${p&&p.tel?`<a class="tel" href="tel:${esc(p.tel)}" onclick="event.stopPropagation()">${esc(p.tel)}</a>`:''}</div><button class="btn sm grn" data-act="callDone" data-id="${c.id}">Arandı</button></div>`;
  }));
  // planlar
  const plans=S.plans.filter(p=>!p.done).sort((a,b)=>(a.tarih+(a.saat||'')).localeCompare(b.tarih+(b.saat||'')));
  const planRow=(p,cls,lab)=>`<div class="card ${cls} item"><div class="grow" data-act="go" data-p="patient" data-id="${p.patientId}"><b>${esc(pname(patient(p.patientId)))}</b> <span class="badge ${cls==='danger'?'red':''}">${lab}</span><div class="muted">${fd(p.tarih)} ${esc(p.saat||'')} · ${esc(p.islem||'')}</div></div><button class="btn sm" data-act="planDo" data-id="${p.id}">Ziyaret yaptım</button></div>`;
  h+=section('⚠️ Yapılmamış planlar',plans.filter(p=>p.tarih<t).map(p=>planRow(p,'danger',dayDiff(p.tarih,t)+' gün geçti')));
  h+=section('📅 Bugünün planları',plans.filter(p=>p.tarih===t).map(p=>planRow(p,'alert','bugün')));
  h+=section('🗓 Önümüzdeki 7 gün',plans.filter(p=>p.tarih>t&&p.tarih<=addDays(t,7)).map(p=>planRow(p,'','+'+dayDiff(t,p.tarih)+' gün')));
  // stok uyarıları
  const low=S.stock.filter(i=>num(i.minAdet)>0&&num(i.adet)<=num(i.minAdet));
  h+=section('📦 Azalan stok',low.map(i=>`<div class="card alert item" data-act="stockEdit" data-id="${i.id}"><div class="grow"><b>${esc(i.ad)}</b></div><div class="red"><b>${i.adet}</b> <span class="muted">/ uyarı ${i.minAdet}</span></div></div>`));
  const exp=S.stock.filter(i=>i.skt&&num(i.adet)>0&&dayDiff(t,i.skt)<=num(S.settings.sktDays)).sort((a,b)=>a.skt.localeCompare(b.skt));
  h+=section('⏳ Son kullanma tarihi',exp.map(i=>{const d=dayDiff(t,i.skt);return `<div class="card ${d<0?'danger':'alert'} item" data-act="stockEdit" data-id="${i.id}"><div class="grow"><b>${esc(i.ad)}</b><div class="muted">SKT ${fd(i.skt)} · ${i.adet} adet</div></div><span class="badge ${d<0?'red':'org'}">${d<0?'geçti':d+' gün'}</span></div>`;}));
  // aylık özet
  h+=`<h2>${MN[m]} ${y} özeti</h2><div class="card"><div class="row"><div><div class="muted">Ziyaret</div><div class="big">${st.n}</div></div><div><div class="muted">Alınan ücret</div><div class="big" style="font-size:20px">${money(st.ucret)}</div></div></div><div style="margin-top:8px" class="muted">Net kâr</div><div class="big ${st.net<0?'red':'grn'}">${money(st.net)}</div>${st.labBorc>0?`<div class="muted" style="margin-top:6px">Ödenmemiş laboratuvar borcu: ${money(st.labBorc)}</div>`:''}</div>`;
  // ay ay ziyaretler (en yeniden eskiye)
  if(S.visits.length){
    const now=ymNow(),hm=HM&&HM<=now?HM:now,mv=recentVisits().filter(v=>v.tarih.slice(0,7)===hm);
    const tu=mv.reduce((a,v)=>a+num(v.ucret),0),bo=mv.reduce((a,v)=>a+visitBorc(v),0);
    h+=`<h2 id="hm_top">🕘 Ziyaretlerim</h2><div class="card"><div class="item"><button class="btn sm gray" data-act="hmNav" data-d="-1">‹ Önceki</button><div class="grow" style="text-align:center"><b>${ymTitle(hm)}</b></div><button class="btn sm gray" data-act="hmNav" data-d="1" ${hm>=now?'disabled style="opacity:.35"':''}>Sonraki ›</button></div>
    <label>Ay seç<input type="month" id="hm_pick" value="${hm}" max="${now}"></label>
    <div class="muted" style="margin-top:8px">${mv.length} ziyaret · alınan ${money(tu)}${bo>0?` · <span class="red">kalan borç ${money(bo)}</span>`:''}</div>${hm!==now?'<button class="btn sm gray full" style="margin-top:8px" data-act="hmNow">Bu aya dön</button>':''}</div>`;
    h+=mv.length?mv.map(recentRow).join(''):'<div class="empty">Bu ay ziyaret yok</div>';
  }
  return {t:'Ana Sayfa',h};
}

function pPatient(){
  const p=patient(R.id);
  if(!p)return {t:'Hasta',back:1,h:'<div class="empty">Hasta bulunamadı</div>'};
  const vs=S.visits.filter(v=>v.patientId===p.id).sort((a,b)=>(b.tarih+(b.saat||'')).localeCompare(a.tarih+(a.saat||'')));
  let ucret=0,mal=0,borc=0;vs.forEach(v=>{const c=visitCalc(v);ucret+=num(v.ucret);mal+=c.maliyet;borc+=c.borc;});
  const a=ageOf(p.dogum);
  let h=`<div class="card"><div class="item"><div class="grow"><b style="font-size:19px">${esc(pname(p))}</b><div class="muted">${a!==''?a+' yaş · ':''}${p.dogum?fd(p.dogum):''}</div>${p.tel?`<a class="tel" href="tel:${esc(p.tel)}">📞 ${esc(p.tel)}</a>`:''}</div></div>${p.not?`<div class="note">⚠️ ${esc(p.not)}</div>`:''}</div>`;
  h+=`<div class="card sum"><table class="tb"><tr><td>Toplam ziyaret</td><td class="r">${vs.length}</td></tr><tr><td>Toplam ücret</td><td class="r">${money(ucret)}</td></tr><tr><td>Toplam maliyet</td><td class="r">${money(mal)}</td></tr><tr class="tot"><td>Kâr</td><td class="r ${ucret-mal<0?'red':'grn'}">${money(ucret-mal)}</td></tr><tr class="tot"><td>Kalan borç</td><td class="r ${borc>0?'red':''}">${money(borc)}</td></tr></table>${borc>0?`<button class="btn sm grn" style="margin-top:8px" data-act="pay" data-id="${p.id}">Ödeme al</button>`:''}</div>`;
  h+=`<div class="row" style="margin-bottom:10px"><button class="btn" data-act="visitNew" data-id="${p.id}">+ Ziyaret</button><button class="btn gray" data-act="planNew" data-id="${p.id}">+ Plan</button></div>`;
  const tabs=[['visits','Ziyaretler'],['plans','Planlar'],['files','Tahliller'],['info','Bilgiler']];
  h+=`<div class="seg">${tabs.map(t=>`<button class="${P.tab===t[0]?'on':''}" data-act="ptab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>`;
  if(P.tab==='visits')h+=vs.length?vs.map(visitCard).join(''):'<div class="empty">Henüz ziyaret yok</div>';
  if(P.tab==='plans'){
    const pl=S.plans.filter(x=>x.patientId===p.id).sort((a,b)=>b.tarih.localeCompare(a.tarih));
    const cl=S.calls.filter(c=>c.patientId===p.id&&!c.done);
    h+=cl.map(c=>`<div class="card danger item"><div class="grow"><b>📞 Hastayı ara</b><div class="muted">${fd(c.tarih)}${c.neden?' · '+esc(c.neden):''}</div></div><button class="btn sm grn" data-act="callDone" data-id="${c.id}">Arandı</button></div>`).join('');
    const dc=S.calls.filter(c=>c.patientId===p.id&&c.done&&!c.visitId).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));
    h+=dc.map(c=>`<div class="card"><b>📞 ${fd(c.doneAt)} arandı</b><div class="muted">${esc(c.not||'')}</div></div>`).join('');
    h+=pl.length?pl.map(x=>`<div class="card item"><div class="grow" data-act="planEdit" data-id="${x.id}"><b>${fd(x.tarih)} ${esc(x.saat||'')}</b> ${x.done?'<span class="badge grn">yapıldı</span>':''}<div class="muted">${esc(x.islem||'')}</div></div>${x.done?'':`<button class="btn sm" data-act="planDo" data-id="${x.id}">Ziyaret yaptım</button>`}</div>`).join(''):'<div class="empty">Planlanan işlem yok</div>';
  }
  if(P.tab==='files'){
    const fl=S.files.filter(f=>f.patientId===p.id).sort((a,b)=>b.tarih.localeCompare(a.tarih));

  }
  if(P.tab==='info'){
    const row=(l,v)=>v?`<tr><td class="muted">${l}</td><td>${esc(v)}</td></tr>`:'';
    h+=`<div class="card"><table class="tb">${row('Ad Soyad',pname(p))}${row('Doğum tarihi',fd(p.dogum))}${row('TC / Pasaport',p.tc)}${row('Telefon',p.tel)}${row('Adres',p.adres)}${row('Notlar',p.not)}</table></div><div class="row"><button class="btn" data-act="patEdit" data-id="${p.id}">Düzenle</button><button class="btn red" data-act="patDel" data-id="${p.id}">Hastayı sil</button></div>
    <button class="btn gray full" style="margin-top:10px" data-act="patMerge" data-id="${p.id}">🔗 Başka bir kayıtla birleştir</button><div class="muted">Aynı kişi iki kez kaydedildiyse diğer kaydı seç: ziyaretleri bu hastaya taşınır, diğer kayıt silinir.</div>`;
  }
  return {t:pname(p),back:1,h};
}

function addMalz(s,sign,n){
  n=n||1;
  (s.malz||[]).forEach(m=>{
    const st=S.stock.find(x=>x.id===m.id);if(!st)return;
    const it=V.items.find(i=>i.id===m.id),q=num(m.adet)*n;
    if(sign>0){if(it)it.adet+=q;else V.items.push({id:st.id,ad:st.ad,tip:st.tip,adet:q,birim:num(st.birim)});}
    else if(it){it.adet-=q;if(it.adet<=0)V.items=V.items.filter(x=>x!==it);}
  });
}
function deleteVisitData(v){
  applyStock(v,+1);
  S.visits=S.visits.filter(x=>x.id!==v.id);
  S.calls=S.calls.filter(c=>!(c.visitId===v.id&&!c.done));
  S.plans=S.plans.filter(p=>!(p.fromVisit===v.id&&!p.done));
}

function pStock(){
  const groups=[['serum','Serumlar'],['ilac','İlaçlar'],['malzeme','Malzemeler']];
  const total=S.stock.reduce((a,i)=>a+Math.max(0,num(i.adet))*num(i.birim),0);
  const t=today();
  let h=`<div class="card"><div class="muted">Toplam stok değeri</div><div class="big">${money(total)}</div></div><button class="btn full" data-act="stockNew">+ Yeni kalem ekle</button>`;
  groups.forEach(([k,l])=>{
    const L=S.stock.filter(i=>i.tip===k).sort((a,b)=>a.ad.localeCompare(b.ad,'tr'));
    h+=`<h2>${l}</h2>`;
    if(!L.length)h+='<div class="empty">Henüz yok</div>';
    L.forEach(i=>{
      const low=num(i.minAdet)>0&&num(i.adet)<=num(i.minAdet);

      h+=`<div class="card item"><div class="grow" data-act="stockEdit" data-id="${i.id}"><b>${esc(i.ad)}</b>${low?'<span class="badge red">azalıyor</span>':''}${d!=null&&d<0?'<span class="badge red">SKT geçti</span>':(d!=null&&d<=num(S.settings.sktDays)?'<span class="badge org">SKT yakın</span>':'')}<div class="muted">Birim ${money(i.birim)} · SKT ${i.skt?fd(i.skt):'—'}</div><div class="muted">Değer ${money(Math.max(0,num(i.adet))*num(i.birim))}</div></div><div class="qty"><div class="${low||num(i.adet)<0?'red':''}">${i.adet}</div><button class="btn sm" data-act="stockAdd" data-id="${i.id}">+ Ekle</button></div></div>`;
    });
  });
  return {t:'Depo',h};
}

/* ---------- Laboratuvar ---------- */
// Liste fiyatı olan testte: laboratuvara = fiyat × labK, hastaya = fiyat × satK. Liste fiyatı yoksa elle girilen tutarlar.
const hasF=t=>t.fiyat!=null&&t.fiyat!=='';
const testCost=t=>hasF(t)?round2(num(t.fiyat)*num(S.settings.labK)):num(t.maliyet);
const testSale=t=>hasF(t)?round2(num(t.fiyat)*num(S.settings.satK)):num(t.satis);
const grpTests=g=>(g.tests||[]).map(id=>S.tests.find(t=>t.id===id)).filter(Boolean);
const byAd=(a,b)=>a.ad.localeCompare(b.ad,'tr');
function testSearch(q,lim){
  const ws=fold(q).split(/\s+/).filter(Boolean);if(!ws.length)return [];
  const L=S.tests.filter(t=>{const h=fold(t.ad+' '+(t.kod||''));return ws.every(w=>h.includes(w));});
  const rank=t=>{const a=fold(t.ad);return a.startsWith(ws[0])?0:a.split(/[\s,(/-]+/).some(x=>x.startsWith(ws[0]))?1:2;};
  return L.sort((a,b)=>rank(a)-rank(b)||byAd(a,b)).slice(0,lim);
}
function labList(q){
  const qq=String(q||'').trim();
  const L=qq?testSearch(qq,60):S.tests.slice().sort(byAd).slice(0,30);
  const head=qq?(L.length?'':'<div class="empty">Bulunamadı</div>'):(S.tests.length>30?`<div class="muted" style="margin:8px 2px">${S.tests.length} testten ilk 30'u gösteriliyor. Aramak için yukarıya yaz.</div>`:'');
  return head+L.map(t=>`<div class="card item" data-act="testEdit" data-id="${t.id}"><div class="grow"><b>${esc(t.ad)}</b><div class="muted">${t.kod?esc(t.kod)+' · ':''}${hasF(t)?'Liste '+money(t.fiyat)+' · ':''}Laboratuvara ${money(testCost(t))} · Hastaya ${money(testSale(t))}</div></div></div>`).join('');
}
function pLab(){
  const st=S.settings;
  let h=`<div class="card"><b>Fiyat listesi</b><div class="muted">${S.tests.length} test kayıtlı.<br>Laboratuvara ödenen = liste fiyatı × <b>${ns(st.labK)}</b><br>Hastadan alınan = liste fiyatı × <b>${ns(st.satK)}</b> + hizmet bedeli (ziyarette elle yazılır)</div>
  <div class="row" style="margin-top:8px"><button class="btn sm" data-act="labXl">📄 Excel'den yükle</button><button class="btn sm gray" data-act="labK">Çarpanları değiştir</button></div>

  <div class="note">Fiyat veya çarpan değişirse sadece sonraki ziyaretlere uygulanır, eski kayıtlar değişmez.</div>`;

  h+=`<h2>Testler</h2><input id="lab_q" placeholder="🔍 Test ara (ad veya kod)" value="${esc(R.lq||'')}" autocomplete="off"><button class="btn gray full" style="margin-top:8px" data-act="testNew">+ Elle test ekle</button><div id="lab_l">${labList(R.lq)}</div>`;

  return {t:'Laboratuvar',h};

function grpRender(){
  const ts=GD.tests.map(id=>S.tests.find(t=>t.id===id)).filter(Boolean);
  const sc=$('#modal')?$('#modal').scrollTop:0;
  modal(`<h3>${GD.id?'Grubu düzenle':'Yeni grup'}</h3>
  <label>Grup adı<input id="gd_ad" value="${esc(GD.ad)}" placeholder="Örn. Kardiyovasküler" autocomplete="off"></label>

/* ---------- Excel / CSV'den test listesi ---------- */
async function unzip(u8,want){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let e=-1;for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error('format');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={},td=new TextDecoder();
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)throw new Error('format');
    const method=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    if(!want(name))continue;
    const st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),data=u8.subarray(st,st+cs);
    let raw;
    if(method===0)raw=data;
    else if(method===8){
      if(typeof DecompressionStream==='undefined')throw new Error('nodecomp');
      raw=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    }else throw new Error('format');
    out[name]=td.decode(raw);
  }
  return out;
}
function csvSplit(l,sep){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}else if(ch==='"')q=true;else if(ch===sep){o.push(c);c='';}else c+=ch;}o.push(c);return o;}
async function readSheetRows(file){
  if(/\.csv$/i.test(file.name)||file.type==='text/csv'){
    const txt=(await file.text()).replace(/^﻿/,'').replace(/\r/g,''),first=txt.split('\n')[0];
    const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
    return txt.split('\n').map(l=>csvSplit(l,sep));
  }
  const files=await unzip(new Uint8Array(await file.arrayBuffer()),n=>n==='xl/sharedStrings.xml'||/^xl\/worksheets\/sheet\d+\.xml$/.test(n));
  const dp=new DOMParser();
  const ss=files['xl/sharedStrings.xml']?[...dp.parseFromString(files['xl/sharedStrings.xml'],'application/xml').getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
  const sh=Object.keys(files).filter(n=>n.includes('worksheets')).sort((a,b)=>parseInt(a.match(/(\d+)\.xml/)[1])-parseInt(b.match(/(\d+)\.xml/)[1]))[0];
  if(!sh)throw new Error('format');
  const colIdx=s=>{let n=0;for(const ch of s.toUpperCase())n=n*26+ch.charCodeAt(0)-64;return n-1;};
  const rows=[];
  for(const r of dp.parseFromString(files[sh],'application/xml').getElementsByTagName('row')){
    const arr=[];let pos=0;
    for(const c of r.getElementsByTagName('c')){
      const ref=(c.getAttribute('r')||'').replace(/\d+/g,'');const col=ref?colIdx(ref):pos;pos=col+1;
      const t=c.getAttribute('t'),ve=c.getElementsByTagName('v')[0];let v;
      if(t==='s')v=ss[+(ve?ve.textContent:-1)];
      else if(t==='inlineStr')v=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
      else{v=ve?ve.textContent:'';if(t!=='str'&&t!=='e'&&v!==''&&!isNaN(+v))v=+v;}
      arr[col]=v;
    }
    rows.push(arr);
  }
  return rows;
}
function parseTestRows(rows){
  let hi=-1,nc=-1,pc=-1,kc=-1;
  for(let i=0;i<Math.min(rows.length,30)&&hi<0;i++){
    const r=(rows[i]||[]).map(x=>fold(String(x==null?'':x)).trim());
    const n=r.findIndex(x=>/test|tahlil|analiz|ad[iı]?$/.test(x)),p=r.findIndex(x=>/fiyat|ucret|tutar/.test(x));
    if(n>=0&&p>=0){hi=i;nc=n;pc=p;kc=r.findIndex(x=>/^kod/.test(x));}
  }
  if(hi<0)throw new Error('header');
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]||[],ad=String(r[nc]==null?'':r[nc]).replace(/\s+/g,' ').trim();
    const f=typeof r[pc]==='number'?r[pc]:num(String(r[pc]==null?'':r[pc]).replace(/[^\d.,]/g,''));
    if(!ad||!(f>0))continue;
    out.push({kod:kc>=0?String(r[kc]==null?'':r[kc]).trim():'',ad,fiyat:round2(f)});
  }
  return out;
}
function matchTests(list){
  const cnt=(arr,k)=>arr.reduce((m,x)=>{if(x.kod)m[x.kod]=(m[x.kod]||0)+1;return m;},{});
  const nk=cnt(list),ok=cnt(S.tests);
  return list.map(x=>{
    let t=S.tests.find(t=>t.kod&&x.kod&&t.kod===x.kod&&fold(t.ad)===fold(x.ad));
    if(!t&&x.kod&&nk[x.kod]===1&&ok[x.kod]===1)t=S.tests.find(t=>t.kod===x.kod);
    if(!t)t=S.tests.find(t=>fold(t.ad)===fold(x.ad));
    return {x,t};
  });
}

      const note=(dm[6]||'').replace(/[^\p{L}\s]/gu,' ').replace(/\s+/g,' ').trim();
      const d={d:+dm[1],m:+dm[2],y:+dm[3],t:dm[4]!=null?pad(+dm[4])+':'+dm[5]:'',note:note.length>=2?note:''};
      if(d.m>=1&&d.m<=12&&d.y>=2000&&d.y<=2100)lastD={y:d.y,m:d.m};
      if(!ses||ses.persons.length){ses={dates:[],persons:[]};g.sessions.push(ses);}
      ses.dates.push(d);per=null;continue;
    }
    const mc=costLine(L);
    if(mc){if(!g)newG();if(mc.v!=null)g.costs[mc.k]=mc.v;g.seen[mc.k]=true;if(mc.nurse)g.nurse=mc.nurse;g.closed=true;per=null;continue;}
    if(per&&!per.svc&&META_RX.test(L)){
      const pp=parsePerson(L);['tel','tc','dogum'].forEach(k=>{if(pp[k]&&!per[k])per[k]=pp[k];});per.raw.push(L);continue;
    }
    if(per&&!per.svc&&(per.ad||per.ref)&&per.addr.length===0&&!PHONE_RX.test(L)&&!isServ(L)&&!META_RX.test(L)&&isServ(nx)){per.raw.push(L);per.addr.push(L);continue;}
    if(isPersonStart(L,nx)){
      const pp=parsePerson(L);
      if(!pp.ad&&!pp.ref&&per&&!per.svc){['tel','tc','dogum'].forEach(k=>{if(pp[k]&&!per[k])per[k]=pp[k];});per.raw.push(L);continue;}
      if(!g||g.closed)newG();
      if(!ses){ses={dates:[],persons:[]};g.sessions.push(ses);}
      per=Object.assign(pp,{svc:null,svcs:[],addr:[],raw:[L]});
      ses.persons.push(per);continue;
    }
    if(!per&&isServ(L)){
      if(!g||g.closed)newG();
      if(!ses){ses={dates:[],persons:[]};g.sessions.push(ses);}
      per={ad:'',soyad:'',tel:'',tc:'',dogum:'',par:[],ref:'',svc:null,svcs:[],addr:[],raw:[]};
      ses.persons.push(per);
    }
    if(per){
      per.raw.push(L);
      if(isItemLine(L)){const it=parseItemLine(L);if(!per.svc)per.svc=it;per.svcs.push(it);}
      else if(!per.svc){
        if(!isServ(L)&&isServ(nx)){per.addr.push(L);}
        else{per.svc=parseService(L);per.svcs.push(per.svc);}
      }
      else if(isServ(L))per.svcs.push(parseService(L));
      else per.addr.push(L);
      continue;}
  }
  flush();
  const out=[];const refN={};
  const payNames=pays.filter(y=>y.tip==='hemsire').map(y=>y.ad);
  const parNames=groups.filter(gr=>gr.nurse).map(gr=>gr.nurse.ad).filter(n=>n.trim().split(/\s+/).length>1).map(capWords);
  groups.forEach(gr=>{
    const vs=[];
    gr.sessions.forEach(s=>{const dates=s.dates.length?s.dates:[null];s.persons.forEach(p=>dates.forEach(d=>vs.push({d,p})));});
    const N=vs.length;if(!N)return;
    const U=gr.costs.u,M=gr.costs.m,K=gr.costs.kar;
    const share=(T,i)=>T==null?0:(i<N-1?round2(T/N):round2(T-round2(T/N)*(N-1)));
    const nurseAd=gr.nurse?resolveNurse(gr.nurse.ad,[...payNames,...parNames]):'';
    vs.forEach((e,i)=>{
      const d=e.d,p=e.p,sv=mergeSvc(p.svcs.length?p.svcs:(p.svc?[p.svc]:[]));
      const w=[],n=[];let tarih='',saat='';
      if(!d)w.push({k:'t',m:'Tarih yok'});
      else{
        const dt=new Date(d.y,d.m-1,d.d);
        if(dt.getFullYear()===d.y&&dt.getMonth()===d.m-1&&dt.getDate()===d.d){tarih=ymd(dt);saat=d.t;}
        else w.push({k:'t',m:'Tarih geçersiz ('+d.d+'.'+d.m+'.'+d.y+')'});
      }
      let ad=p.ad,soyad=p.soyad,anon=false,ref='';
      if(p.ref){
        ref=capWords(p.ref);refN[nkey(ref)]=(refN[nkey(ref)]||0)+1;
        ad=ref+' hastası';soyad=(tarih?fd(tarih):'tarihsiz')+' #'+refN[nkey(ref)];
        n.push('Yönlendirilen hasta, ayrı hasta olarak açılır. Adını hasta kartından düzeltebilirsin');
      }else if(!ad){anon=true;ad='İsimsiz';soyad='Kayıt '+(tarih?fd(tarih):'tarihsiz')+' #'+(out.filter(o=>o.anon).length+1);n.push('İsim okunamadı, geçici ad verildi. Hasta kartından düzeltebilirsin');}
      if(p.tc&&/^[1-8]\d{10}$/.test(p.tc)&&!validTC(p.tc))n.push('TC geçersiz görünüyor');
      if(U==null)n.push('Ücret yazılmamış, alınamadı (0) sayıldı');
      if(M==null&&!gr.seen.m)n.push('Maliyet yazılmamış');
      if(N>1)n.push('Ücret ve maliyet '+N+' ziyarete bölündü');
      if(!sv.base)n.push('Hizmet satırı yok');
      if(K!=null&&U!=null&&M!=null&&Math.abs(U-M-K)>=1)n.push('Defterdeki kâr ('+money(K)+') ücret − maliyet ile tutmuyor');
      const items=sv.items.map(it=>{
        const st=S.stock.find(s=>lc(s.ad)===lc(it.ad))||S.stock.find(s=>lc(s.ad).startsWith(lc(it.ad)));
        const o={id:st?st.id:'x'+uid(),ad:st?st.ad:it.ad,tip:st?st.tip:'ilac',adet:it.adet,birim:0};
        if(it.uyg!=null)o.uyg=it.uyg;
        return o;
      });
      const hz=[],svcN={};
      (sv.list||[]).forEach(b=>{
        const fb=fold(b.base);
        const sx=b.base==='Serum'?S.services.find(s=>s.tip==='serum'):S.services.find(s=>fold(s.ad)===fb)||S.services.find(s=>fold(s.ad).startsWith(fb))||(fb.startsWith('damar')?S.services.find(s=>fold(s.ad).startsWith('damar')):null);
        if(sx){if(!hz.includes(sx.id))hz.push(sx.id);svcN[sx.id]=(svcN[sx.id]||0)+b.count;}
      });
      const pnot=[...(p.par||[]).map(t=>'Defterde: ('+t+')'),ref?'Yönlendiren: '+ref:''].filter(Boolean).join(' · ');
      out.push({include:false,w,n,fix:[],tarih,saat,ad,soyad,anon,ref:!!ref,raw:(p.ad||p.ref)?'':(p.raw||[]).join(' | '),tel:p.tel,tc:p.tc,dogum:p.dogum||'',adres:p.addr.join(' '),pnot,
        hizmetler:hz,svcN,hizmetAd:sv.names||[],items,sikayet:sv.note,dnot:d&&d.note?d.note:'',
        ucret:share(U,i),maliyet:share(M,i),kimAd:nurseAd,hemsireUcret:gr.nurse?share(gr.nurse.tutar,i):0,mark:''});
    });
  });
  // tarih yazım hatası kontrolü (komşu kayıtlara göre)
  const ym0=out.map(x=>x.tarih?(+x.tarih.slice(0,4))*12+(+x.tarih.slice(5,7)-1):null);
  const ymTxt=v=>pad(v%12+1)+'.'+Math.floor(v/12);
  out.forEach((x,i)=>{
    const a=ym0[i];if(a==null)return;
    const nb=[];
    for(let j=Math.max(0,i-8);j<=Math.min(out.length-1,i+8);j++){if(j!==i&&ym0[j]!=null)nb.push(ym0[j]);}
    if(nb.length<3)return;
    const cnt={};nb.forEach(b=>cnt[b]=(cnt[b]||0)+1);
    const mode=+Object.keys(cnt).sort((p,q)=>cnt[q]-cnt[p])[0];
    const diff=a-mode;
    if(diff!==0&&diff%12===0&&cnt[mode]>=nb.length/2){
      const yOld=+x.tarih.slice(0,4),yNew=yOld-diff/12;
      x.tarih=yNew+x.tarih.slice(4);
      x.fix.push('Yıl defterde '+yOld+' yazılmış, '+yNew+' olarak düzeltildi');
      if(x.anon)x.soyad=x.soyad.replace(/\d{2}\.\d{2}\.\d{4}/,fd(x.tarih));
      if(x.ref)x.soyad=x.soyad.replace(/\d{2}\.\d{2}\.\d{4}/,fd(x.tarih));
      return;
    }
    const near=nb.filter(b=>Math.abs(a-b)<=2).length;
    if(near<nb.length/2){x.w.push({k:'t',m:'Tarih komşu kayıtlardan çok farklı, kontrol et'});return;}
    let pv=null,nv=null;
    for(let j=i-1;j>=0;j--)if(ym0[j]!=null){pv=ym0[j];break;}
    for(let j=i+1;j<out.length;j++)if(ym0[j]!=null){nv=ym0[j];break;}
    if(pv!=null&&pv===nv&&pv!==a)x.w.push({k:'t',m:'Önceki ve sonraki kayıtlar '+ymTxt(pv)+', bu kayıt '+ymTxt(a)+'. Yazım hatası olabilir, kontrol et'});
  });
  // hasta eşleştirme ve tekrar kontrolü
  const seen=new Set(),usedDup=new Set();
  out.forEach(x=>{
    const ex=matchPatient(x),keys=patKeys(x);
    x.mark=ex?'mevcut hasta':(keys.some(k=>seen.has(k))?'bu aktarımda':'yeni hasta');
    keys.forEach(k=>seen.add(k));
    if(ex&&x.tarih){
      const dv=S.visits.find(v=>v.patientId===ex.id&&v.eski&&v.tarih===x.tarih&&!usedDup.has(v.id)&&Math.abs(num(v.ucret)-x.ucret)<0.01&&Math.abs(num(v.maliyet)-x.maliyet)<0.01);
      if(dv){usedDup.add(dv.id);x.w.push({k:'d',m:'Aynı hasta, tarih ve ücretle daha önce aktarılmış, tekrar eklenmesin diye seçilmedi'});}
    }
    x.include=x.w.length===0;
  });
  const gotU=round2(out.reduce((a,x)=>a+x.ucret,0)),gotM=round2(out.reduce((a,x)=>a+x.maliyet,0));
  const cmp=totals.found?{fileU:totals.u,fileM:totals.m,gotU,gotM,ok:Math.abs(totals.u-gotU)<1&&Math.abs(totals.m-gotM)<1}:null;
  pays.forEach(y=>{
    y.dahil=true;
    if(y.tip==='hemsire'){
      const k=nkey(y.ad),mo=y.tarih.slice(0,7);
      const fromV=round2(out.filter(x=>x.kimAd&&nkey(x.kimAd)===k&&x.tarih&&x.tarih.slice(0,7)===mo).reduce((a,x)=>a+x.hemsireUcret,0));
      if(fromV>0){
        y.include=false;
        y.note=Math.abs(fromV-y.tutar)<1?'Ziyaretlerde hemşire ücreti olarak zaten var, ayrıca eklenmesine gerek yok':'Ziyaretlerdeki hemşire ücreti '+money(fromV)+', burada '+money(y.tutar)+'. Farkı kontrol et';
        return;
      }
    }
    const dup=S.extPay.some(e=>e.tip===y.tip&&e.ad===y.ad&&e.tarih.slice(0,7)===y.tarih.slice(0,7)&&Math.abs(num(e.tutar)-y.tutar)<0.01);
    y.include=y.known&&!dup;
    y.note=!y.known?'İsim tanınmadı: hemşire ise işaretle':(dup?'Aynı ödeme zaten kayıtlı':'');
  });
  return {items:out,cmp,pays};
}

const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);};
const unb64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function makeBackup(pw){
  const files=[];
  for(const f of S.files){const b=await fGet(f.id);if(b)files.push({id:f.id,type:b.type,data:b64(new Uint8Array(await b.arrayBuffer()))});}
  const json=JSON.stringify({app:'hastatakip',ver:1,at:new Date().toISOString(),state:S,files});
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pw,salt);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(json)));
  return new Blob([JSON.stringify({m:'HT1',s:b64(salt),i:b64(iv),d:b64(ct)})],{type:'application/json'});
}
async function restoreBackup(file,pw){
  const o=JSON.parse(await file.text());
  if(o.m!=='HT1')throw new Error('format');
  const key=await deriveKey(pw,unb64(o.s));
  let plain;
  try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.i)},key,unb64(o.d));}catch(e){throw new Error('pw');}
  const p=JSON.parse(new TextDecoder().decode(plain));
  if(!p.state)throw new Error('format');
  await fClear();
  for(const f of p.files||[])await fPut(f.id,new Blob([unb64(f.data)],{type:f.type}));
  S=ensureShape(p.state);
  await kvSet('state',S);
}
async function saveFile(blob,name){
  const f=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title:name});return true;}catch(e){if(e&&e.name==='AbortError')return false;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);return true;
}

/* ---------- Hasta arama / birleştirme ---------- */
const nameToks=p=>fold(pname(p)).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
const isRefP=p=>/hastas[ıi]$/i.test(String(p.ad||'').trim())||/^isimsiz/.test(fold(p.ad||''));
const tcConf=(a,b)=>!!(a.tc&&b.tc&&a.tc!==b.tc);
function dupGroups(){
  const ps=S.patients.filter(p=>!isRefP(p));
  const par=new Map(ps.map(p=>[p.id,p.id]));
  const f=x=>{while(par.get(x)!==x){par.set(x,par.get(par.get(x)));x=par.get(x);}return x;};
  const un=(a,b)=>par.set(f(a),f(b));
  const by=kf=>{const m=new Map();ps.forEach(p=>{const k=kf(p);if(!k)return;if(!m.has(k))m.set(k,[]);m.get(k).push(p);});return m;};
  by(p=>p.tc&&String(p.tc).length>=5?'tc:'+p.tc:'').forEach(g=>{for(let i=1;i<g.length;i++)un(g[0].id,g[i].id);});
  by(p=>{const t=nameToks(p);return t.length?'n:'+t.slice().sort().join(' '):'';}).forEach(g=>{for(let i=1;i<g.length;i++)if(!tcConf(g[0],g[i]))un(g[0].id,g[i].id);});
  const nd=new Set(S.notDup||[]);
  const gm=new Map();ps.forEach(p=>{const r=f(p.id);if(!gm.has(r))gm.set(r,[]);gm.get(r).push(p);});
  const sure=[],maybe=[],seen=new Set();
  gm.forEach(g=>{if(g.length<2)return;const k=g.map(p=>p.id).sort().join('|');if(nd.has(k))return;seen.add(k);(new Set(g.map(p=>p.tc).filter(Boolean)).size>1?maybe:sure).push(g);});
  const addM=(a,b)=>{if(a.id===b.id||tcConf(a,b)||f(a.id)===f(b.id))return;const k=[a.id,b.id].sort().join('|');if(seen.has(k)||nd.has(k))return;seen.add(k);maybe.push([a,b]);};
  const pairs=g=>{if(g.length>8)return;for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++)addM(g[i],g[j]);};
  by(p=>{const t=tail10(p.tel),n=nameToks(p);return t&&n.length?t+'|'+n[0]:'';}).forEach(pairs);
  by(p=>{const n=nameToks(p);return n.length>=2?n[0]+'|'+n[n.length-1]:'';}).forEach(pairs);
  return {sure,maybe};
}
function mergePatients(ids,mainId){
  const ps=ids.map(patient).filter(Boolean);if(ps.length<2)return null;
  const VI=vIndex();
  ps.sort((a,b)=>(b.id===mainId)-(a.id===mainId)||(VI.get(b.id)||[]).length-(VI.get(a.id)||[]).length);
  const m=ps[0],others=ps.slice(1);
  const notes=m.not?[m.not]:[];
  // en eksiksiz isim kalsın (elle seçilen ana kayıtta isim değişmez)
  if(!mainId){const best=ps.slice().sort((a,b)=>nameToks(b).length-nameToks(a).length)[0];if(best!==m&&nameToks(best).length>nameToks(m).length){notes.push('Diğer kayıttaki ad: '+pname(m));m.ad=best.ad;m.soyad=best.soyad;}}
  others.forEach(o=>{
    ['dogum','tc','tel','adres'].forEach(k=>{if(!m[k]&&o[k])m[k]=o[k];});
    if(o.tel&&tail10(o.tel)!==tail10(m.tel))notes.push('Diğer telefon: '+o.tel);
    if(o.adres&&fold(o.adres)!==fold(m.adres))notes.push('Diğer adres: '+o.adres);
    if(o.not)String(o.not).split('\n').forEach(l=>{if(l&&!notes.includes(l))notes.push(l);});
    if(nkey(pname(o))!==nkey(pname(m)))notes.push('Diğer kayıttaki ad: '+pname(o));
    if(o.created&&(!m.created||o.created<m.created))m.created=o.created;
    S.visits.forEach(v=>{if(v.patientId===o.id)v.patientId=m.id;});
    ['plans','calls','files'].forEach(k=>S[k].forEach(x=>{if(x.patientId===o.id)x.patientId=m.id;}));
  });
  m.not=[...new Set(notes)].join('\n');
  S.patients=S.patients.filter(p=>!others.includes(p));
  return m;
}
function pDups(){
  const dg=dupGroups(),VI=vIndex();
  const mem=p=>{const vs=VI.get(p.id)||[];const last=vs.map(v=>v.tarih).sort().pop();return `<div style="margin-bottom:6px"><b>${esc(pname(p))}</b><div class="muted">${p.tc?'TC '+esc(p.tc)+' · ':''}${p.tel?esc(p.tel)+' · ':''}${vs.length} ziyaret${last?' · son '+fd(last):''}</div>${p.adres?`<div class="muted">📍 ${esc(String(p.adres).slice(0,70))}</div>`:''}</div>`;};
  const card=(g,kind)=>`<div class="card ${kind==='m'?'alert':''}">${g.map(mem).join('')}<div class="btns">${kind==='m'?`<button class="btn sm gray" data-act="dupNo" data-ids="${g.map(p=>p.id).join(',')}">Farklı kişiler</button>`:''}<button class="btn sm" data-act="dupMerge" data-ids="${g.map(p=>p.id).join(',')}">Birleştir</button></div></div>`;
  let h=`<div class="note">Birleştirince bütün ziyaretler, planlar ve tahlil dosyaları tek kayıtta toplanır. Eksik bilgiler diğer kayıttan tamamlanır; farklı telefon, adres ve ad notlara yazılır. Önce yedek almanı öneririm.</div>`;
  h+=`<h2>Kesin aynı (${dg.sure.length})</h2>`+(dg.sure.length?`<div class="muted" style="margin:0 2px 8px">Aynı TC veya birebir aynı ad soyad.</div><button class="btn full" data-act="dupAll">Hepsini birleştir (${dg.sure.length} grup)</button>${dg.sure.map(g=>card(g,'s')).join('')}`:'<div class="empty">Yok</div>');
  h+=`<h2>Olası aynı (${dg.maybe.length})</h2>`+(dg.maybe.length?`<div class="muted" style="margin:0 2px 8px">Aynı telefon ve aynı ilk ad, ya da aynı ad ve soyad (ortadaki ad farklı). Aile bireyi de olabilir; tek tek bak.</div>${dg.maybe.map(g=>card(g,'m')).join('')}`:'<div class="empty">Yok</div>');
  return {t:'Aynı hastalar',back:1,h};
}

/* ---------- Analiz ---------- */
const ATYPES=[['all','Hepsi'],['serum','Serum'],['kan','Kan / tahlil'],['enj','Enjeksiyon'],['damar','Damar yolu']];
function vType(v,t){
  if(t==='all')return true;
  const nm=fold((v.hizmetAd||[]).join(' '));
  const tips=(v.hizmetler||[]).map(id=>(S.services.find(s=>s.id===id)||{}).tip);
  if(t==='serum')return tips.includes('serum')||/serum|izotonik|ringer/.test(nm);
  if(t==='kan')return tips.includes('lab')||(v.tests||[]).length>0||/kan alma|laborat|tahlil/.test(nm);
  if(t==='enj')return /enjeksiyon|igne|ilac uygulama/.test(nm);
  if(t==='damar')return /damar/.test(nm);
  return true;
}
function patStats(t){
  const VI=vIndex(),td=today(),out=[];
  const calls=new Map();S.calls.forEach(c=>{let o=calls.get(c.patientId);if(!o){o={last:'',son:'',open:false};calls.set(c.patientId,o);}if(c.done&&c.doneAt&&c.doneAt>=o.last){o.last=c.doneAt;o.son=c.sonuc||'';}if(!c.done)o.open=true;});
  const plans=new Set(S.plans.filter(x=>!x.done&&x.tarih>=td).map(x=>x.patientId));
  S.patients.forEach(p=>{
    const vs=(VI.get(p.id)||[]).filter(v=>v.tarih&&vType(v,t));if(!vs.length)return;
    const ds=[...new Set(vs.map(v=>v.tarih))].sort();
    // 3 günden yakın ziyaretler (kür) tek seferlik sayılır
    const eps=[];ds.forEach(d=>{if(!eps.length||dayDiff(eps[eps.length-1].last,d)>3)eps.push({start:d,last:d});else eps[eps.length-1].last=d;});
    const gaps=[];for(let i=1;i<eps.length;i++)gaps.push(dayDiff(eps[i-1].start,eps[i].start));
    const sg=gaps.slice().sort((a,b)=>a-b),med=sg.length?sg[Math.floor((sg.length-1)/2)]:null;
    const last=ds[ds.length-1],c=calls.get(p.id)||{last:'',son:'',open:false};
    out.push({p,n:vs.length,eps:eps.length,med,last,first:ds[0],since:dayDiff(last,td),ciro:vs.reduce((a,v)=>a+num(v.ucret),0),lastCall:c.last,lastSonuc:c.son,openCall:c.open,openPlan:plans.has(p.id)});
  });
  return out;
}
function district(p){
  const a=String(p.adres||'');
  const m=a.match(/([A-Za-zÇĞİÖŞÜçğıöşü]+)\s*\/\s*(?:[İIi]stanbul|[İIi]st\b)/i);
  return m?cap(m[1]):'';
}
function mahalle(p){
  const m=String(p.adres||'').match(/((?:[A-ZÇĞİÖŞÜ][a-zçğıöşü]+\s)?[A-ZÇĞİÖŞÜ][a-zçğıöşü]+)\s+(?:Mahallesi|Mah\.?|Mh\.?)(?=\s|$|,)/);
  return m?m[1]:'';
}
const agoTxt=d=>d<45?d+' gün':d<730?Math.round(d/30)+' ay':(Math.round(d/36.5)/10).toString().replace('.',',')+' yıl';

const ymOf=(y,m)=>y+'-'+pad(m+1);

function anPeriod(){const k=R.ap||'12';const t=today();return k==='12'?{k,from:ymd(new Date(+t.slice(0,4),+t.slice(5,7)-12,1)),lab:'Son 12 ay'}:k==='y'?{k,from:t.slice(0,4)+'-01-01',lab:'Bu yıl'}:{k,from:'0000',lab:'Tüm zamanlar'};}

const vCat=v=>{for(const [k,l] of SVCAT)if(vType(v,k))return l;return 'Diğer';};
function stockForecast(){
  const from=addDays(today(),-90),use={};
  S.visits.forEach(v=>{if(v.eski||isNurse(v)||!v.tarih||v.tarih<from)return;(v.items||[]).forEach(i=>{use[i.id]=(use[i.id]||0)+num(i.adet);});});
  const first=S.visits.filter(v=>!v.eski&&v.tarih).map(v=>v.tarih).sort()[0];
  const span=Math.max(14,Math.min(90,first?dayDiff(first,today())+1:90));
  return S.stock.filter(s=>use[s.id]>0).map(s=>{const perDay=use[s.id]/span;return {s,used:use[s.id],perMonth:round2(perDay*30),days:perDay>0?Math.floor(Math.max(0,num(s.adet))/perDay):null};}).sort((a,b)=>a.days-b.days);
}
function insights(st){
  const out=[],t=today(),ym=t.slice(0,7),pm=ymAdd(ym,-1);
  const cur=periodStats(+ym.slice(0,4),+ym.slice(5,7)-1),prev=periodStats(+pm.slice(0,4),+pm.slice(5,7)-1);
  const day=+t.slice(8,10),dim=daysInMonth(ym);
  if(prev.ucret>0&&day>=7){const fc=cur.ucret/day*dim,p=pct(fc,prev.ucret);if(p!=null&&Math.abs(p)>=10)out.push({ic:p<0?'📉':'📈',t:`Bu ay bu hızla giderse ciro <b>${money(Math.round(fc))}</b> olur, geçen aydan <b>%${Math.abs(p)} ${p<0?'düşük':'yüksek'}</b>.`,go:'ozet'});}
  const due=st.filter(x=>x.eps>=3&&x.med>=7&&x.med<=400&&x.since>=x.med*0.85&&!x.p.aramaYok&&!x.openCall);

  const lost=st.filter(x=>x.eps>=2&&x.since>180&&!x.p.aramaYok&&(!x.lastCall||x.lastCall<x.last)).sort((a,b)=>b.ciro-a.ciro);
  if(lost.length)out.push({ic:'🔁',t:`6 aydan uzun süredir çağırmayan <b>${lost.length} eski hastan</b> var. En değerli 5'i toplam <b>${money(lost.slice(0,5).reduce((a,x)=>a+x.ciro,0))}</b> getirmişti.`,go:'gk',sub:'kayip'});
  const nf=st.filter(x=>x.eps===1&&x.since>=21&&x.since<=120&&!x.lastCall&&!x.p.aramaYok);
  const pq=gkQueue(st).length;
  const bdn=st.filter(x=>x.p.dogum&&!x.p.aramaYok&&daysToBday(x.p.dogum)<=7).length;
  if(bdn)out.push({ic:'🎂',t:`Önümüzdeki 7 günde <b>${bdn} hastanın</b> doğum günü var. Kısa bir tebrik mesajı at.`,go:'gk',sub:'dogum'});
  if(pq)out.unshift({ic:'🔥',t:`Geri kazanma listesinde <b>${pq} hasta</b> sırada. Bugün en değerli 3-5 kişiyi ara.`,go:'gk',sub:'oncelik'});
  if(nf.length)out.push({ic:'👋',t:`Son 4 ayda ilk kez gelip bir daha çağırmayan <b>${nf.length} hasta</b> var. Bir "nasılsınız" araması yeniden çağırmalarını sağlayabilir.`,go:'gk',sub:'tek'});
  const dl=debtList(),old=dl.filter(x=>dayDiff(x.ilk,t)>90);
  if(old.length)out.push({ic:'💰',t:`<b>${old.length} hastanın</b> borcu 90 günü geçti, toplam <b>${money(old.reduce((a,x)=>a+x.borc,0))}</b>.`,go:'debts'});
  const fc=stockForecast().filter(x=>x.days!=null&&x.days<=21);
  if(fc.length)out.push({ic:'📦',t:`Kullanım hızına göre yakında bitecek: ${fc.slice(0,4).map(x=>`<b>${esc(x.s.ad)}</b> (${x.days} gün)`).join(', ')}.`,go:'hizmet'});
  const lb=S.visits.filter(v=>visitCalc(v).labCost>0&&!v.labOdendi);
  if(lb.length)out.push({ic:'🧪',t:`Laboratuvara ödenmemiş <b>${lb.length} ziyaret</b> var (${money(lb.reduce((a,v)=>a+visitCalc(v).labCost,0))}).`,go:'fin'});
  // en kârlı hizmet (son 12 ay)
  const from=ymd(new Date(+t.slice(0,4),+t.slice(5,7)-12,1)),cs={};
  S.visits.filter(v=>v.tarih>=from).forEach(v=>{const c=vCat(v),k=visitCalc(v);const o=cs[c]||(cs[c]={n:0,kar:0});o.n++;o.kar+=k.kar;});
  const best=Object.entries(cs).filter(([,o])=>o.n>=5).sort((a,b)=>b[1].kar/b[1].n-a[1].kar/a[1].n)[0];
  if(best)out.push({ic:'⭐',t:`Son 12 ayda ziyaret başına en çok kazandıran hizmet: <b>${esc(best[0])}</b> (ortalama ${money(best[1].kar/best[1].n)} kâr).`,go:'hizmet'});
  return out;
}
function anOzet(st){

function anHizmet(){

  const cs={};vs.forEach(v=>{const c=vCat(v),k=visitCalc(v);const o=cs[c]||(cs[c]={n:0,u:0,m:0});o.n++;o.u+=num(v.ucret);o.m+=k.maliyet;});
  const L=Object.entries(cs).sort((a,b)=>(b[1].u-b[1].m)-(a[1].u-a[1].m)),mk=Math.max(1,...L.map(([,o])=>o.u-o.m));
  h+=`<h2>Hizmetlere göre kâr (${pr.lab})</h2><div class="card">${L.length?L.map(([c,o])=>hbar(esc(c)+` <span class="muted">(${o.n})</span>`,o.u-o.m,mk,money(o.u-o.m))).join('')+`<table class="tb" style="margin-top:10px"><tr><th>Hizmet</th><th class="r">Ort. ücret</th><th class="r">Ort. kâr</th><th class="r">Kâr %</th></tr>${L.map(([c,o])=>`<tr><td>${esc(c)}</td><td class="r">${money(o.u/o.n)}</td><td class="r">${money((o.u-o.m)/o.n)}</td><td class="r">%${o.u?Math.round((o.u-o.m)/o.u*100):0}</td></tr>`).join('')}</table><div class="muted" style="margin-top:6px">Birden fazla hizmet içeren ziyaret ilk uyan gruba yazılır (serum önce). Giderler (yakıt vb.) burada yok, sadece ziyaret maliyeti.</div>`:'<div class="empty">Bu dönemde ziyaret yok</div>'}</div>`;
  // kim yaptı
  const ks={};vs.forEach(v=>{const k=isNurse(v)?(v.kimAd||'Hemşire'):'Ben',c=visitCalc(v);const o=ks[k]||(ks[k]={n:0,u:0,kar:0});o.n++;o.u+=num(v.ucret);o.kar+=c.kar;});
  const KL=Object.entries(ks).sort((a,b)=>b[1].n-a[1].n);

  // ilaçlar
  const ds={};vs.forEach(v=>(v.items||[]).forEach(i=>{if(i.tip==='malzeme'||i.tip==='serum')return;const k=normDrug(i.ad);const o=ds[k]||(ds[k]={n:0,a:0});o.n++;o.a+=num(i.adet);}));
  const DL=Object.entries(ds).sort((a,b)=>b[1].n-a[1].n).slice(0,15),md=Math.max(1,...DL.map(([,o])=>o.n));
  if(DL.length)h+=`<h2>En çok kullanılan ilaçlar</h2><div class="card">${DL.map(([k,o])=>hbar(esc(k),o.n,md,o.n+' ziyaret')).join('')}</div>`;
  // depo tahmini
  const fc=stockForecast();
  h+=`<h2>Depo tahmini</h2><div class="card">${fc.length?`<div class="muted" style="margin-bottom:6px">Son 3 aydaki kullanım hızına göre elindeki stok kaç gün yeter.</div><table class="tb"><tr><th>Kalem</th><th class="r">Elde</th><th class="r">Aylık</th><th class="r">Yeter</th></tr>${fc.map(x=>`<tr class="click" data-act="stockEdit" data-id="${x.s.id}"><td>${esc(x.s.ad)}</td><td class="r">${x.s.adet}</td><td class="r">${ns(x.perMonth)}</td><td class="r ${x.days<=14?'red':x.days<=30?'org':''}"><b>${x.days==null?'—':x.days>365?'1 yıl+':x.days+' gün'}</b></td></tr>`).join('')}</table>`:'<div class="muted">Uygulamadan girilen ziyaretler biriktikçe burada hangi ilacın kaç gün yeteceği görünecek. Not defterinden aktarılan eski ziyaretler depoyla bağlantılı olmadığı için sayılmaz.</div>'}</div>`;

function anZaman(){
  const pr=anPeriod(),vs=S.visits.filter(v=>v.tarih&&v.tarih>=pr.from);
  let h=periodChips();
  const GN=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'],wd=[0,0,0,0,0,0,0],wu=[0,0,0,0,0,0,0];
  vs.forEach(v=>{const [y,m,d]=v.tarih.split('-').map(Number);const i=(new Date(y,m-1,d).getDay()+6)%7;wd[i]++;wu[i]+=num(v.ucret);});
  const mw=Math.max(1,...wd);
  h+=`<h2>Haftanın günleri (${pr.lab})</h2><div class="card">${GN.map((g,i)=>hbar(g,wd[i],mw,wd[i]+' · '+money(wu[i]))).join('')}<div class="muted" style="margin-top:6px">Sakin günlerde kampanya veya kontrol ziyaretleri planlamak, yoğun günlerde hemşireye iş devretmek için.</div></div>`;
  const HB=[['00–08',0,8],['08–11',8,11],['11–14',11,14],['14–17',14,17],['17–20',17,20],['20–24',20,24]],hc=HB.map(()=>0);let nh=0;
  vs.forEach(v=>{const m=String(v.saat||'').match(/^(\d{1,2}):/);if(!m)return;nh++;const hr=+m[1];HB.forEach((b,i)=>{if(hr>=b[1]&&hr<b[2])hc[i]++;});});
  if(nh)h+=`<h2>Saatler</h2><div class="card">${HB.map((b,i)=>hbar(b[0],hc[i],Math.max(1,...hc),String(hc[i]))).join('')}<div class="muted" style="margin-top:6px">${nh} ziyaretin saati kayıtlı (not defterinden aktarılanların saati yok).</div></div>`;
  // yılın ayları (tüm zamanlar, yıllık ortalama)
  const mc=Array(12).fill(0),yrs=Array(12).fill(null).map(()=>new Set());
  S.visits.forEach(v=>{if(!v.tarih)return;const m=+v.tarih.slice(5,7)-1;mc[m]++;yrs[m].add(v.tarih.slice(0,4));});
  const avg=mc.map((c,i)=>yrs[i].size?c/yrs[i].size:0),ma=Math.max(1,...avg);
  if(S.visits.length)h+=`<h2>Yılın ayları (tüm yılların ortalaması)</h2><div class="card">${MN.map((n,i)=>hbar(n,avg[i],ma,avg[i]?ns(Math.round(avg[i]*10)/10):'—')).join('')}<div class="muted" style="margin-top:6px">Mevsimsel yoğunluk (grip, bayram, yaz). Yoğun aydan önce depoyu doldurmak, sakin ayda tanıtım yapmak için.</div></div>`;
  return h;
}
function anBolge(st){
  const by=fn=>{const m=new Map();st.forEach(x=>{const k=fn(x.p);if(!k)return;let o=m.get(k);if(!o){o={k,n:0,v:0,c:0,lost:0};m.set(k,o);}o.n++;o.v+=x.n;o.c+=x.ciro;if(x.since>180)o.lost++;});return [...m.values()].sort((a,b)=>b.c-a.c);};
  const tb=(L,ttl)=>`<h2>${ttl}</h2><div class="card"><table class="tb"><tr><th>Yer</th><th class="r">Hasta</th><th class="r">Ciro</th></tr>${L.slice(0,25).map(o=>`<tr class="click" data-act="goSearch" data-q="${esc(o.k)}"><td>${esc(o.k)}${o.lost?`<div class="muted">${o.lost} hasta 6 aydan uzun gelmedi</div>`:''}</td><td class="r">${o.n}</td><td class="r">${money(o.c)}</td></tr>`).join('')}</table></div>`;
  let h=`<div class="note">Hastalarının adreslerine göre. Satıra dokununca o yerdeki hastalar listelenir. Çok hastan olan bölgede tanıtım (site yönetimi, eczane, apartman panosu) daha verimli olur; aynı bölgedeki ziyaretleri aynı güne toplamak yakıttan tasarruf ettirir.</div>`;
  const il=by(district),mh=by(mahalle);
  h+=il.length?tb(il,'İlçeler'):'';h+=mh.length?tb(mh,'Mahalle / site'):'';
  if(!il.length&&!mh.length)h+='<div class="empty">Adres bilgisi olan hasta yok</div>';
  return h;
}
function pAnalysis(){
  const tab=R.at==='hasta'?'gk':(R.at||'gk');
  const tabs=[['gk','Geri kazan'],['ozet','Özet'],['hizmet','Hizmet'],['zaman','Zaman'],['bolge','Bölge']];
  let h=`<div class="seg">${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" data-act="anTab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>`;
  if(!S.visits.length)return {t:'Analiz',back:1,h:h+'<div class="empty">Ziyaret kaydı biriktikçe burası dolacak.</div>'};
  const st=patStats(tab==='gk'?(R.aty||'all'):'all');
  if(tab==='ozet')h+=anOzet(st);
  if(tab==='gk')h+=anGK(st);
  if(tab==='hizmet')h+=anHizmet();
  if(tab==='zaman')h+=anZaman();
  if(tab==='bolge')h+=anBolge(st);
  return {t:'Analiz',back:1,h};
}

/* ---------- Hesaplar ---------- */
function movements(id){
  const L=[];
  S.visits.forEach(v=>(v.pays||[]).forEach(p=>{if(p.hesap===id)L.push({tarih:p.tarih,t:num(p.tutar),ad:pname(patient(v.patientId)),sub:'Tahsilat · '+((v.hizmetAd||[]).join(', ')||'ziyaret')+(p.tarih!==v.tarih?' ('+fd(v.tarih)+' ziyareti)':''),act:`data-act="go" data-p="patient" data-id="${v.patientId}"`});}));
  S.expenses.forEach(e=>{if(e.hesap===id)L.push({tarih:e.tarih,t:-num(e.tutar),ad:e.kategori,sub:e.aciklama||'',act:`data-act="expEdit" data-id="${e.id}"`});});
  S.purchases.forEach(p=>{if(p.hesap===id)L.push({tarih:p.tarih,t:-num(p.tutar),ad:'Depo alımı',sub:p.ad||'',act:`data-act="purEdit" data-id="${p.id}"`});});
  S.extPay.forEach(e=>{if(e.hesap===id)L.push({tarih:e.tarih,t:-num(e.tutar),ad:e.tip==='lab'?'ULTRALAB ödemesi':'Hemşire: '+e.ad,sub:e.not||'',act:`data-act="payEdit" data-id="${e.id}"`});});
  (S.transfers||[]).forEach(tr=>{
    const f=accById(tr.from),t=accById(tr.to),act=`data-act="trEdit" data-id="${tr.id}"`;
    if(tr.from===id)L.push({tarih:tr.tarih,t:-num(tr.tutar),ad:t&&t.tip==='kisisel'?'👤 Kendime aktardım':'↔ Aktarım → '+(t?t.ad:'?'),sub:tr.not||'',act,tr:1});
    if(tr.to===id)L.push({tarih:tr.tarih,t:num(tr.tutar),ad:f&&f.tip==='kisisel'?(accById(id)&&accById(id).tip==='kisisel'?'Kendime aktardım':'👤 Cebimden işletmeye koydum'):(accById(id)&&accById(id).tip==='kisisel'?'👤 İşletmeden aldığım ('+(f?f.ad:'?')+')':'↔ Aktarım ← '+(f?f.ad:'?')),sub:tr.not||'',act,tr:1});
  });
  return L.sort((a,b)=>b.tarih.localeCompare(a.tarih));
}
const ymNow=()=>today().slice(0,7);
const ymTitle=ym=>MN[+ym.slice(5,7)-1]+' '+ym.slice(0,4);

/* ---------- Bakiye ve aktarımlar ---------- */
const hasBal=a=>a&&(a.tip==='banka'||a.tip==='nakit');
// Bakiye: son elle girilen bakiye + o tarihten SONRAKİ hareketler
function lastBal(id){return (S.balAdj||[]).filter(b=>b.hesap===id).sort((a,b)=>(a.tarih+(a.at||'')).localeCompare(b.tarih+(b.at||''))).pop()||null;}
function balance(id){
  const cp=lastBal(id);if(!cp)return null;
  return round2(num(cp.bakiye)+movements(id).filter(x=>x.tarih>cp.tarih).reduce((s,x)=>s+x.t,0));
}
function balAt(id,tarih){ // tarih günü sonundaki hesaplanan bakiye (o güne kadarki son elle girişe göre)
  const cps=(S.balAdj||[]).filter(b=>b.hesap===id&&b.tarih<=tarih).sort((a,b)=>(a.tarih+(a.at||'')).localeCompare(b.tarih+(b.at||'')));
  const cp=cps.pop();if(!cp)return null;
  return round2(num(cp.bakiye)+movements(id).filter(x=>x.tarih>cp.tarih&&x.tarih<=tarih).reduce((s,x)=>s+x.t,0));
}
const isOwnerOut=tr=>{const a=accById(tr.to);return a&&a.tip==='kisisel';};
function ownerTotals(from,to){
  let cek=0,koy=0;
  (S.transfers||[]).forEach(tr=>{if(tr.tarih<from||tr.tarih>to)return;const f=accById(tr.from),t=accById(tr.to);if(t&&t.tip==='kisisel'&&(!f||f.tip!=='kisisel'))cek+=num(tr.tutar);if(f&&f.tip==='kisisel'&&(!t||t.tip!=='kisisel'))koy+=num(tr.tutar);});
  return {cek:round2(cek),koy:round2(koy)};
}

function trForm(tr,fromId){

/* ---------- Kredi kartı ekstresi (ekran görüntüsünden kopyalanan metin) ---------- */
const MONK={oca:1,ocak:1,sub:2,subat:2,mar:3,mart:3,nis:4,nisan:4,may:5,mayis:5,haz:6,haziran:6,tem:7,temmuz:7,agu:8,agustos:8,eyl:9,eylul:9,eki:10,ekim:10,kas:11,kasim:11,ara:12,aralik:12};
const AMT_RX=/([+\-−–])?\s*(?:₺|TL|TRY)?\s*(\d{1,3}(?:\.\d{3})+|\d+),(\d{2})(?!\d)\s*(?:TL|₺|TRY)?/i;
const TRL='A-Za-zÇĞİÖŞÜçğıöşü';
const MONW_RX=new RegExp(`(?<![${TRL}])(Ocak|Şubat|Mart|Nisan|Mayıs|Haziran|Temmuz|Ağustos|Eylül|Ekim|Kasım|Aralık|Oca|Şub|Nis|Haz|Tem|Ağu|Eyl|Eki|Kas|Pazartesi|Salı|Çarşamba|Perşembe|Cuma|Cumartesi|Pazar|Bugün|Dün)\\.?(?![${TRL}])`,'gi');
const STSKIP_RX=/toplam|bakiye|limit|asgari|son odeme|donem borc|ekstre|kullanilabilir|borcunuz|faiz|odemeniz|hesap ozet|kesim tarihi|puan|bonus|chippara|maxipuan|worldpuan|nakit avans|islemler$|harcamalar$/;
const STCREDIT_RX=/iade|odeme\b|odemesi|odendi|tesekkur|para yatir|gelen/;
function stDate(s){
  let m=s.match(/(?<!\d)(\d{1,2})[./-](\d{1,2})[./-](\d{4}|\d{2})(?!\d)/);
  if(m){let y=+m[3];if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1]);if(d.getMonth()===+m[2]-1&&d.getDate()===+m[1])return ymd(d);}
  const f=fold(s);
  m=f.match(/(?<!\d)(\d{1,2})\s+(ocak|subat|mart|nisan|mayis|haziran|temmuz|agustos|eylul|ekim|kasim|aralik|oca|sub|mar|nis|may|haz|tem|agu|eyl|eki|kas|ara)[a-z]*\.?(?:\s+(\d{4}))?/);
  if(m){const mo=MONK[m[2]],y=m[3]?+m[3]:new Date().getFullYear();let d=ymd(new Date(y,mo-1,+m[1]));if(!m[3]&&d>today())d=ymd(new Date(y-1,mo-1,+m[1]));return d;}
  if(/(^|\s)bugun(\s|$)/.test(f))return today();
  if(/(^|\s)dun(\s|$)/.test(f))return addDays(today(),-1);
  return null;
}
function stClean(s){
  return s.replace(new RegExp(AMT_RX.source,'gi'),' ').replace(/(?<!\d)\d{1,2}[./-]\d{1,2}[./-]\d{2,4}(?!\d)/g,' ').replace(/(?<!\d)\d{1,2}:\d{2}(?::\d{2})?(?!\d)/g,' ')
    .replace(MONW_RX,' ').replace(/(?<!\d)\d{1,2}(?=\s|$)/g,' ').replace(/(?:^|\s)(TL|TRY|₺)(?=\s|$)/gi,' ').replace(/\s+/g,' ').replace(/^[\s\-–•·|:*]+|[\s\-–•·|:*]+$/g,'').trim();
}
const STOPW=new Set(['istanbul','ankara','izmir','tr','tur','turkiye','as','a','s','ltd','sti','san','tic','ve','sube','subesi','magaza','mrk','merkez','sanayi','ticaret','limited','sirketi','pos','www','com']);
const mkey=s=>fold(s).replace(/[^a-z ]/g,' ').split(/\s+/).filter(w=>w.length>=3&&!STOPW.has(w)).slice(0,2).join(' ');
const findCat=pre=>allCats().find(c=>fold(c).startsWith(pre))||null;
const DEF_RULES=[
  [/ultra\s*lab/,'__lab'],
  [/eczane|eczanesi|(^|\s)ecz(\s|\.|$)|pharma/,()=>findCat('eczane')],
  [/opet|shell|petrol|(^|\s)bp(\s|$)|total\s*energ|totalenerg|aytemiz|lukoil|alpet|kadoil|moil|sunpet|akaryakit|turkpetrol|(^|\s)po(\s|$)/,()=>findCat('yakit')],
  [/avukat|hukuk burosu|(^|\s)baro(\s|$)/,()=>findCat('avukat')],
  [/lastik|oto servis|otomotiv|yedek parca|oto yikama|car wash/,()=>findCat('arac')]
];
function stClassify(ad){
  const f=fold(ad);
  const r=(S.catRules||[]).slice().sort((a,b)=>b.k.length-a.k.length).find(x=>x.k&&f.includes(x.k));
  if(r&&(r.kat.startsWith('__')||allCats().includes(r.kat)))return r.kat;
  for(const [rx,k] of DEF_RULES){if(rx.test(f)){const c=typeof k==='function'?k():k;if(c)return c;}}
  return null;
}
function parseStatement(text,hesap){
  const lines=text.replace(/\r/g,'').replace(INVIS_RX,'').split('\n').map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
  const rows=[];let curD=null,pend=[];
  lines.forEach(L=>{
    const d=stDate(L);if(d)curD=d;
    const am=L.match(AMT_RX),fl=fold(L),txt=stClean(L);
    if(!am){if(txt.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g,'').length>=3&&!STSKIP_RX.test(fold(txt)))pend.push(txt);return;}
    if(STSKIP_RX.test(fl)&&txt.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g,'').length>=3){pend=[];return;}
    const ad=txt.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g,'').length>=3?txt:(pend[0]||'');
    const tutar=num(am[2]+','+am[3]);pend=[];
    if(!(tutar>0))return;
    const credit=am[1]==='+'||STCREDIT_RX.test(fold(ad));
    const kat=credit?'__skip':stClassify(ad);
    const r={ad:ad||'(adı okunamadı)',tarih:curD||today(),noDate:!curD,tutar,credit,kat,key:mkey(ad),include:!credit&&!!ad,note:''};
    if(credit)r.note='Para girişi, ödeme veya iade olabilir';
    const dup=S.expenses.some(e=>e.hesap===hesap&&e.tarih===r.tarih&&Math.abs(num(e.tutar)-tutar)<0.01)||S.purchases.some(e=>e.hesap===hesap&&e.tarih===r.tarih&&Math.abs(num(e.tutar)-tutar)<0.01)||S.extPay.some(e=>e.hesap===hesap&&e.tarih===r.tarih&&Math.abs(num(e.tutar)-tutar)<0.01);
    if(dup){r.include=false;r.note='Bu harcama zaten kayıtlı görünüyor';}
    rows.push(r);
  });
  return rows;
}

  labK:()=>openForm({title:'Çarpanlar',note:'Değişiklik sadece bundan sonraki ziyaretlere uygulanır.',

  labXl:()=>{const inp=$('#xlIn');inp.value='';inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    let list;
    try{list=parseTestRows(await readSheetRows(f));}
    catch(e){alert(e.message==='nodecomp'?'Telefonun bu Excel dosyasını açamıyor (iOS güncel değil). Excel\'i bilgisayarda "CSV (noktalı virgülle ayrılmış)" olarak kaydedip onu yükle.':e.message==='header'?'Dosyada "TEST ADI" ve "FİYAT" başlıklı sütunlar bulunamadı.':'Dosya okunamadı. Excel (.xlsx) veya CSV olmalı.');return;}

    const m=matchTests(list);
    const nw=m.filter(z=>!z.t),ch=m.filter(z=>z.t&&(!hasF(z.t)||round2(num(z.t.fiyat))!==z.x.fiyat)),same=m.length-nw.length-ch.length;

    ${ch.length?`<h2>Fiyatı değişenlerden örnekler</h2>${ch.slice(0,5).map(z=>`<div class="muted">${esc(z.x.ad)}: ${hasF(z.t)?money(z.t.fiyat):'elle'} → ${money(z.x.fiyat)}</div>`).join('')}`:''}

  'v-save':()=>{
    if(!V.tarih){toast('Tarih seçmelisin');return;}
    if(!V.hizmetler.length&&!confirm('Hiç hizmet seçilmedi. Yine de kaydedilsin mi?'))return;
    const nurse=V.kim!=='ben';
    const hem=S.nurses.find(n=>n.id===V.kim);
    const v={
      id:V.id||uid(),patientId:V.patientId,tarih:V.tarih,saat:V.saat,kim:V.kim,kimAd:nurse?(hem?hem.ad:(V.kimAd||'Hemşire')):'',
      hizmetler:V.hizmetler.slice(),svcN:Object.assign({},V.svcN||{}),hizmetAd:V.hizmetler.map(id=>{const sv=S.services.find(s=>s.id===id);const n=(V.svcN||{})[id]||1;return sv?sv.ad+(n>1?' ×'+n:''):null;}).filter(Boolean),
      items:V.items.filter(i=>i.adet>0).map(i=>{const o={id:i.id,ad:i.ad,tip:i.tip,adet:i.adet,birim:num(i.birim)};if(i.uyg!=null&&i.uyg!==i.adet)o.uyg=i.uyg;return o;}),
      tests:V.tests.map(t=>({id:t.id,ad:t.ad,maliyet:num(t.maliyet),satis:num(t.satis)})),
      hizmetBedeli:num(V.hizmetBedeli),ucret:num(V.ucret),odenen:num(V.odenen),hemsireUcret:nurse?num(V.hemsireUcret):0,
      labOdendi:!!V.labOdendi,sikayet:V.sikayet,olcum:V.olcum,kontrol:V.kontrol,not:V.not
    };
    if(V.eski){v.eski=true;v.maliyet=num(V.maliyet);}
    else if(V.elle){v.elle=true;v.maliyet=num(V.maliyet);}
    const old=V.id?S.visits.find(x=>x.id===V.id):null;
    // tahsilat kayıtları (hangi hesaba, ne zaman): ödenen tutardaki değişiklik seçilen hesaba yazılır
    {
      const pays=old&&old.pays?old.pays.map(x=>Object.assign({},x)):[];
      const base=old?(old.pays?old.pays.reduce((a,x)=>a+num(x.tutar),0):num(old.odenen)):0;
      let diff=round2(v.odenen-base);
      if(diff>0)pays.push({id:uid(),tarih:old&&today()>v.tarih?today():v.tarih,hesap:V.hesap,tutar:diff});
      while(diff<0&&pays.length){const l=pays[pays.length-1],t=num(l.tutar);if(t<=-diff){pays.pop();diff=round2(diff+t);}else{l.tutar=round2(t+diff);diff=0;}}
      if(diff===0&&pays.length===1&&pays[0].hesap!==V.hesap)pays[0].hesap=V.hesap;
      if(!old)pays.forEach(x=>x.tarih=v.tarih);
      v.pays=pays;
      if(V.hesap)S.settings.lastHesap=V.hesap;
    }
    if(old){applyStock(old,+1);Object.assign(old,v);}else{S.visits.push(v);S.settings.sinceBackup++;}
    applyStock(v,-1);
    // negatif stok uyarısı
    const neg=(nurse||v.eski)?[]:v.items.map(i=>S.stock.find(s=>s.id===i.id)).filter(s=>s&&num(s.adet)<0);
    // ertesi gün arama
    const c=S.calls.find(x=>x.visitId===v.id);
    if(c){if(!c.done)c.tarih=addDays(v.tarih,1);}
    else if(addDays(v.tarih,1)>=addDays(today(),-1))S.calls.push({id:uid(),patientId:v.patientId,visitId:v.id,tarih:addDays(v.tarih,1),done:false});
    // kontrol planı
    const kp=S.plans.find(x=>x.fromVisit===v.id&&!x.done);
    if(v.kontrol){if(kp)kp.tarih=v.kontrol;else S.plans.push({id:uid(),patientId:v.patientId,tarih:v.kontrol,saat:'',islem:'Kontrol',fromVisit:v.id,done:false});}
    else if(kp)S.plans=S.plans.filter(x=>x!==kp);
    if(V.planId){const pl=S.plans.find(x=>x.id===V.planId);if(pl)pl.done=true;}

async function shrink(file){
  if(!String(file.type).startsWith('image/'))return file;
  try{
    const bmp=await createImageBitmap(file),sc=Math.min(1,1800/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
    return b||file;
  }catch(e){return file;}
}

(async function init(){

  try{S=await kvGet('state');}catch(e){S=null;}

  ensureShape(S);

  // 1.8: daha önce kesirli (0,5 gibi) kaydedilen ilaçlar: uygulanan miktar korunur, düşen adet tama yuvarlanır

  if(!S.settings.m21){S.settings.m21=1;if(!S.accounts.some(a=>a.tip==='kisisel'))S.accounts.push({id:'h_kisisel',ad:'Kişisel kart / cebimden',tip:'kisisel'});await kvSet('state',S);}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  render();
})();
