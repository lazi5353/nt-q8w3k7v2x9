<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hasta Takip">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f6b8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Hasta Takip</title>
<style>
:root{--p:#0f6b8a;--p2:#e6f3f7;--bg:#f3f5f7;--card:#fff;--t:#17212b;--m:#667788;--red:#d23b3b;--grn:#1f8f4e;--org:#d98a00;--line:#e1e6ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
#app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;min-height:52px}
header.top h1{font-size:18px;margin:0;flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:7px 11px;font-size:15px}
main{padding:12px}
h2{font-size:15px;color:var(--m);margin:18px 2px 8px;text-transform:uppercase;letter-spacing:.3px}
h3{margin:0 0 10px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card.alert{border-left:4px solid var(--org)}
.card.danger{border-left:4px solid var(--red)}
.item{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.qty{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.qty>div{font-size:20px;font-weight:700}
.muted{color:var(--m);font-size:14px}
.red{color:var(--red)}.grn{color:var(--grn)}.org{color:var(--org)}
.big{font-size:26px;font-weight:700}
.empty{color:var(--m);text-align:center;padding:14px;font-size:14px}
label{display:block;font-size:14px;color:var(--m);margin:8px 0 0}
input,select,textarea{display:block;width:100%;font:inherit;color:var(--t);padding:10px;border:1px solid #cfd8de;border-radius:9px;background:#fff;margin-top:4px;min-height:44px}
input[type=checkbox]{display:inline-block;width:22px;height:22px;min-height:0;margin:0 8px 0 0;vertical-align:middle}
label.chk{display:flex;align-items:center;color:var(--t);font-size:16px;margin:12px 0 4px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{display:inline-block;background:var(--p);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;text-align:center;min-height:44px}
.btn.gray{background:#e3e8ec;color:var(--t)}.btn.red{background:var(--red)}.btn.grn{background:var(--grn)}
.btn.sm{padding:6px 10px;font-size:14px;min-height:34px}
.btn.full{display:block;width:100%;margin-bottom:10px}
.btn.bigbtn{font-size:18px;padding:15px}
.btns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
.chip{border:1px solid #bcc9d1;background:#fff;color:var(--t);border-radius:20px;padding:8px 13px;font:inherit;font-size:15px;min-height:40px}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.chip small{opacity:.7;margin-left:4px}
.seg{display:flex;background:#e3e8ec;border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:8px;font:inherit;font-size:14px;color:var(--t)}
.seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.badge{display:inline-block;font-size:12px;border-radius:10px;padding:2px 8px;background:#eef1f3;color:var(--m);margin-left:4px}
.badge.red{background:#fde8e8;color:var(--red)}.badge.org{background:#fff1d6;color:var(--org)}.badge.grn{background:#e0f4e8;color:var(--grn)}
.note{background:var(--p2);border-radius:9px;padding:9px 11px;font-size:14px;margin:8px 0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:18px;border:1px solid #bcc9d1;background:#fff;font-size:20px;line-height:1}
.tb{width:100%;border-collapse:collapse;font-size:15px}
.tb td,.tb th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
.tb .r,.tb th.r{text-align:right}
.tb tr.hd td{font-weight:700;color:var(--m);font-size:13px;text-transform:uppercase;padding-top:12px}
.tb tr.tot td{font-weight:700}
.tb tr.sub td{color:var(--m);font-size:14px}
.tb tr.click{cursor:pointer}
.chart{display:flex;gap:2px;margin-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center}
.up{height:58px;display:flex;align-items:flex-end}.dn{height:58px;display:flex;align-items:flex-start}
.col i{display:block;width:13px;background:var(--grn);border-radius:3px}.col i.neg{background:var(--red)}
.col small{font-size:10px;color:var(--m)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;border:0;background:transparent;padding:7px 0 6px;font:inherit;font-size:11px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs button span{font-size:20px;line-height:1.2}
nav.tabs button.on{color:var(--p);font-weight:700}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;overflow:auto;padding:14px;-webkit-overflow-scrolling:touch}
#modal.on{display:block}
#modal .box{background:#fff;border-radius:14px;padding:16px;max-width:560px;margin:14px auto}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;display:none;max-width:90%;text-align:center}
img.prev{max-width:100%;border-radius:8px;display:block;margin:0 auto}
a.tel{color:var(--p);text-decoration:none;font-weight:600}
.sum{background:var(--p2)}
.sum .tb td{border-color:#cfe3ea}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs">
<button data-act="tab" data-p="home" data-k="home"><span>🏠</span>Ana</button>
<button data-act="tab" data-p="patients" data-k="patients"><span>👥</span>Hastalar</button>
<button data-act="tab" data-p="stock" data-k="stock"><span>💊</span>Depo</button>
<button data-act="tab" data-p="lab" data-k="lab"><span>🧪</span>Lab</button>
<button data-act="tab" data-p="fin" data-k="fin"><span>📊</span>Maliye</button>
<button data-act="tab" data-p="more" data-k="more"><span>⚙️</span>Daha</button>
</nav>
<div id="modal"></div>
<div id="toast"></div>

<script>
'use strict';
/* ============ Yardımcılar ============ */
const VERSION='1.9';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+n));};
const dayDiff=(a,b)=>{const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);};return Math.round((p(b)-p(a))/86400000);};
const fd=s=>s?s.split('-').reverse().join('.'):'';
const round2=n=>Math.round(n*100)/100;
const MN=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const MS=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
function num(x){
  if(typeof x==='number') return isFinite(x)?x:0;
  let s=String(x==null?'':x).trim().replace(/\s/g,'');
  if(!s) return 0;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=parseFloat(s); return isFinite(n)?n:0;
}
const ns=n=>(n==null||n==='')?'':(typeof n==='string'?n:String(n).replace('.',','));
const fmt=new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',minimumFractionDigits:0,maximumFractionDigits:2});
const money=n=>fmt.format(round2(num(n)));
const lc=s=>String(s||'').toLocaleLowerCase('tr');
// İlaç dozu: adet = depodan düşen (tam ampul), uyg = hastaya uygulanan (örn. 0,5)
const FRS={0.25:'¼',0.5:'½',0.75:'¾'};
function fmtDoz(n){n=round2(num(n));const w=Math.floor(n+1e-9),f=round2(n-w);if(!f)return String(w);return FRS[f]?(w?w:'')+FRS[f]:ns(n);}
const dozFrac=i=>i.uyg!=null?round2(i.uyg-(i.adet-1)):null;
const itemTxt=i=>i.uyg!=null&&i.uyg!==i.adet?`${esc(i.ad)} ${fmtDoz(i.uyg)} (depodan ${i.adet})`:`${esc(i.ad)}${i.adet!==1?' ×'+i.adet:''}`;
function addDoz(list,ad,adet,uyg){
  const u=uyg!=null?uyg:adet;let it=list.find(i=>lc(i.ad)===lc(ad));
  if(it){it.uyg=round2((it.uyg!=null?it.uyg:it.adet)+u);it.adet+=adet;}else{it={ad,adet,uyg:u};list.push(it);}
  if(it.uyg===it.adet)delete it.uyg;
}
function ageOf(d){if(!d)return '';const t=new Date(),[y,m,dd]=d.split('-').map(Number);let a=t.getFullYear()-y;if(t.getMonth()+1<m||(t.getMonth()+1===m&&t.getDate()<dd))a--;return a;}
function validTC(t){
  if(!/^\d{11}$/.test(t)||t[0]==='0') return false;
  const d=t.split('').map(Number);
  const d10=(((d[0]+d[2]+d[4]+d[6]+d[8])*7)-(d[1]+d[3]+d[5]+d[7]))%10;
  const d11=d.slice(0,10).reduce((a,b)=>a+b,0)%10;
  return ((d10+10)%10)===d[9]&&d11===d[10];
}
let toastT;
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',3200);}

/* ============ Veritabanı (IndexedDB) ============ */
let db;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('hastatakip',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('files');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const tx=(s,m)=>db.transaction(s,m).objectStore(s);
const kvGet=k=>rq(tx('kv','readonly').get(k));
const kvSet=(k,v)=>rq(tx('kv','readwrite').put(v,k));
const fGet=id=>rq(tx('files','readonly').get(id));
const fPut=(id,b)=>rq(tx('files','readwrite').put(b,id));
const fDel=id=>rq(tx('files','readwrite').delete(id));
const fClear=()=>rq(tx('files','readwrite').clear());
let saving=Promise.resolve();
function save(){saving=saving.then(()=>kvSet('state',S)).catch(e=>alert('Kaydedilemedi! '+e));return saving;}

/* ============ Başlangıç verisi ============ */
function defaults(){
  const st=(id,ad,tip)=>({id,ad,tip,adet:0,birim:0,minAdet:0,skt:''});
  return {
    v:1,patients:[],visits:[],plans:[],calls:[],files:[],purchases:[],expenses:[],nurses:[],extPay:[],adj:[],
    tests:[],testGroups:[],
    stock:[
      st('sr_iz250','İzotonik 250','serum'),st('sr_iz500','İzotonik 500','serum'),
      st('sr_rl250','Ringer Laktat 250','serum'),st('sr_rl500','Ringer Laktat 500','serum'),
      st('sr_dek','Dekstroz','serum'),st('sr_izo','İzolen','serum'),
      st('st_set','Serum seti','malzeme'),st('st_enj','Enjektör','malzeme'),st('st_intra','İntraket','malzeme'),
      st('st_flaster','Flaster','malzeme'),st('st_probe','Ateş ölçer probu','malzeme'),st('st_strip','Kan şekeri stripi','malzeme')
    ],
    services:[
      {id:'s_serum',ad:'Serum',tip:'serum',ucret:0,malz:[{id:'st_set',adet:1},{id:'st_enj',adet:1},{id:'st_intra',adet:1},{id:'st_flaster',adet:1}]},
      {id:'s_ates',ad:'Ateş ölçme',tip:'normal',ucret:0,malz:[{id:'st_probe',adet:1}]},
      {id:'s_seker',ad:'Kan şekeri',tip:'normal',ucret:0,malz:[{id:'st_strip',adet:1}]},
      {id:'s_enj',ad:'Enjeksiyon / ilaç uygulaması',tip:'normal',ucret:0,malz:[{id:'st_enj',adet:1}]},
      {id:'s_lab',ad:'Laboratuvar',tip:'lab',ucret:0,malz:[]}
    ],
    expCats:['Yakıt','Araç bakım','Eczane (ilaç dışı)','Avukatlık ücreti','Diğer'],
    settings:{lastBackup:null,sinceBackup:0,sktDays:30,labK:1.1,satK:6}
  };
}
function ensureShape(s){const d=defaults();Object.keys(d).forEach(k=>{if(s[k]===undefined)s[k]=d[k];});Object.keys(d.settings).forEach(k=>{if(s.settings[k]===undefined)s.settings[k]=d.settings[k];});return s;}

/* ============ Hesaplar ============ */
function isNurse(v){return v.kim&&v.kim!=='ben';}
function visitCalc(v){
  if(v.eski||v.elle){const m=num(v.maliyet),u=num(v.ucret);return {itemCost:0,labCost:0,nurseFee:0,eski:v.eski?m:0,elle:v.eski?0:m,maliyet:m,kar:u-m,borc:Math.max(0,round2(u-num(v.odenen)))};}
  const nurse=isNurse(v);
  const itemCost=nurse?0:(v.items||[]).reduce((a,i)=>a+num(i.adet)*num(i.birim),0);
  const labCost=(v.tests||[]).reduce((a,t)=>a+num(t.maliyet),0);
  const nurseFee=nurse?num(v.hemsireUcret):0;
  const maliyet=itemCost+labCost+nurseFee;
  const ucret=num(v.ucret);
  return {itemCost,labCost,nurseFee,eski:0,elle:0,maliyet,kar:ucret-maliyet,borc:Math.max(0,round2(ucret-num(v.odenen)))};
}
function allCats(){const c=[...S.expCats];S.expenses.forEach(e=>{if(!c.includes(e.kategori))c.push(e.kategori);});return c;}
function periodStats(y,m){
  const inP=d=>{if(!d)return false;const yy=+d.slice(0,4),mm=+d.slice(5,7)-1;return yy===y&&(m==null||mm===m);};
  const r={n:0,ucret:0,odenen:0,ilac:0,lab:0,hems:0,eski:0,elle:0,labBorc:0,gc:{},giderTop:0,alim:0,adjC:0,adjM:0,infoHems:0,infoLab:0};
  let ucretV=0;
  S.visits.filter(v=>inP(v.tarih)).forEach(v=>{
    const c=visitCalc(v);r.n++;ucretV+=num(v.ucret);r.odenen+=num(v.odenen);
    r.ilac+=c.itemCost;r.lab+=c.labCost;r.hems+=c.nurseFee;r.eski+=c.eski;r.elle+=c.elle;
    if(c.labCost>0&&!v.labOdendi)r.labBorc+=c.labCost;
  });
  allCats().forEach(c=>r.gc[c]=0);
  S.expenses.filter(e=>inP(e.tarih)).forEach(e=>{r.gc[e.kategori]=(r.gc[e.kategori]||0)+num(e.tutar);r.giderTop+=num(e.tutar);});
  S.purchases.filter(p=>inP(p.tarih)).forEach(p=>r.alim+=num(p.tutar));
  S.extPay.filter(e=>inP(e.tarih)).forEach(e=>{
    const t=num(e.tutar);
    if(e.tip==='hemsire'){if(e.dahil)r.infoHems+=t;else r.hems+=t;}
    else{if(e.dahil)r.infoLab+=t;else r.lab+=t;}
  });
  S.adj.filter(a=>inP(a.tarih)).forEach(a=>{r.adjC+=num(a.ciro);r.adjM+=num(a.maliyet);});
  r.ucret=ucretV+r.adjC;
  r.borc=ucretV-r.odenen;
  r.visitCost=r.ilac+r.lab+r.hems+r.eski+r.elle;
  r.tmal=r.visitCost+r.giderTop+r.adjM;
  r.net=r.ucret-r.tmal;
  return r;
}
function applyStock(v,sign){
  if(isNurse(v)||v.eski)return;
  (v.items||[]).forEach(i=>{const s=S.stock.find(x=>x.id===i.id);if(s)s.adet=round2(num(s.adet)+sign*num(i.adet));});
}

/* ============ Durum ve gezinme ============ */
let S,R={page:'home'},H=[],V=null,MF=null,PK=null,SD=null,BK=null,P={tab:'visits'},GD=null,LX=null,VQ='';
const pname=p=>p?((p.ad||'')+' '+(p.soyad||'')).trim():'(silinmiş hasta)';
const patient=id=>S.patients.find(p=>p.id===id);
const TABMAP={home:'home',patients:'patients',patient:'patients',visit:'patients',stock:'stock',lab:'lab',fin:'fin',more:'more',expenses:'more',nurses:'more',services:'more',backup:'more',import:'more'};

function render(keep){
  let pg;
  switch(R.page){
    case 'home':pg=pHome();break;case 'patients':pg=pPatients();break;case 'patient':pg=pPatient();break;
    case 'visit':pg=pVisit();break;case 'stock':pg=pStock();break;case 'lab':pg=pLab();break;
    case 'fin':pg=pFin();break;case 'more':pg=pMore();break;case 'expenses':pg=pExpenses();break;
    case 'nurses':pg=pNurses();break;case 'services':pg=pServices();break;case 'backup':pg=pBackup();break;case 'import':pg=pImport();break;
    default:pg=pHome();
  }
  $('#app').innerHTML=`<header class="top">${pg.back?'<button class="hb" data-act="back">‹ Geri</button>':''}<h1>${esc(pg.t)}</h1>${pg.right||''}</header><main>${pg.h}</main>`;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===TABMAP[R.page]));
  if(R.page==='visit')vRefresh();
  if(!keep)window.scrollTo(0,0);
}
function modal(html){const m=$('#modal');m.innerHTML=`<div class="box">${html}</div>`;m.classList.add('on');}
function closeModal(){$('#modal').classList.remove('on');$('#modal').innerHTML='';MF=null;PK=null;SD=null;GD=null;}

/* ============ Genel form penceresi ============ */
function fieldHtml(f){
  const id='f_'+f.k,val=f.value==null?'':f.value;
  if(f.type==='check')return `<label class="chk"><input type="checkbox" id="${id}" ${val?'checked':''}> ${esc(f.label)}</label>`;
  let c;
  if(f.type==='select')c=`<select id="${id}">${f.options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(val)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  else if(f.type==='area')c=`<textarea id="${id}" rows="3">${esc(val)}</textarea>`;
  else{
    const t={date:'date',time:'time'}[f.type]||'text';
    const im=f.type==='num'?'inputmode="decimal"':f.type==='tel'?'inputmode="tel"':f.type==='tc'?'maxlength="20"':'';
    c=`<input id="${id}" type="${t}" ${im} value="${esc(val)}" placeholder="${esc(f.ph||'')}" autocomplete="off">`;
  }
  return `<label>${esc(f.label)}${c}</label>`;
}
function openForm(o){
  MF=o;
  modal(`<h3>${esc(o.title)}</h3>${o.note?`<div class="note">${o.note}</div>`:''}${o.fields.map(fieldHtml).join('')}<div class="btns">${o.onDelete?'<button class="btn red" data-act="m-del">Sil</button>':''}<button class="btn gray" data-act="m-close">Vazgeç</button><button class="btn" data-act="m-save">Kaydet</button></div>`);
}
function collect(){const v={};MF.fields.forEach(f=>{const e=$('#f_'+f.k);v[f.k]=f.type==='check'?e.checked:e.value.trim();});return v;}

/* ============ Hasta seçici ============ */
function plist(q,mode){
  q=lc(q);
  const L=S.patients.filter(p=>!q||lc(pname(p)).includes(q)||(p.tc||'').includes(q)||(p.tel||'').includes(q)).sort((a,b)=>pname(a).localeCompare(pname(b),'tr'));
  if(!L.length)return '<div class="empty">Hasta bulunamadı</div>';
  const t=today();
  return L.map(p=>{
    const vs=S.visits.filter(v=>v.patientId===p.id);
    const last=vs.map(v=>v.tarih).sort().pop();
    const borc=vs.reduce((a,v)=>a+visitCalc(v).borc,0);
    const plan=S.plans.some(x=>x.patientId===p.id&&!x.done);
    const act=mode==='pick'?'data-act="pk-sel"':'data-act="go" data-p="patient"';
    return `<div class="card item" ${act} data-id="${p.id}"><div class="grow"><b>${esc(pname(p))}</b>${plan?'<span class="badge">📅 plan</span>':''}${borc>0?`<span class="badge red">borç ${money(borc)}</span>`:''}<div class="muted">${last?'Son ziyaret: '+fd(last):'Henüz ziyaret yok'}${p.tel?' · '+esc(p.tel):''}</div></div><div class="muted">›</div></div>`;
  }).join('');
}

function patForm(p,after){
  openForm({
    title:p?'Hasta bilgilerini düzenle':'Yeni hasta',
    fields:[
      {k:'ad',label:'Ad',value:p&&p.ad},{k:'soyad',label:'Soyad',value:p&&p.soyad},
      {k:'dogum',label:'Doğum tarihi',type:'date',value:p&&p.dogum},
      {k:'tc',label:'TC / YKN / Pasaport no',type:'tc',value:p&&p.tc},
      {k:'tel',label:'Telefon',type:'tel',value:p&&p.tel},
      {k:'adres',label:'Ev adresi',type:'area',value:p&&p.adres},
      {k:'not',label:'Önemli notlar (alerji, kronik hastalık vb.)',type:'area',value:p&&p.not}
    ],
    onSave:v=>{
      if(!v.ad){toast('Ad yazmalısın');return false;}
      if(v.tc&&/^[1-8]\d{10}$/.test(v.tc)&&!validTC(v.tc)&&!confirm('TC kimlik numarası geçersiz görünüyor. Yine de kaydedilsin mi?'))return false;
      if(v.tc&&S.patients.some(x=>x.tc===v.tc&&(!p||x.id!==p.id))&&!confirm('Bu TC ile kayıtlı başka bir hasta var. Yine de kaydedilsin mi?'))return false;
      let o=p;
      if(p)Object.assign(p,v);else{o=Object.assign({id:uid(),created:today()},v);S.patients.push(o);}
      save();render(true);if(after)after(o);
    }
  });
}

/* ============ SAYFALAR ============ */
function section(title,rows){return rows.length?`<h2>${title}</h2>${rows.join('')}`:'';}

function pHome(){
  const t=today(),y=+t.slice(0,4),m=+t.slice(5,7)-1;
  const st=periodStats(y,m);
  let h='';
  if(S.patients.length===0)h+=`<div class="note"><b>Hoş geldin.</b> Önce <b>Depo</b> sayfasında ilaç ve malzemelerini (birim maliyetleriyle), <b>Lab</b> sayfasında tahlil fiyatlarını gir. Gerçek hastaları girmeden birkaç gün <b>sahte kayıtlarla</b> dene.</div>`;
  const ls=S.settings.lastBackup;
  if(S.patients.length>0){
    const days=ls?dayDiff(ls.slice(0,10),t):null;
    if(ls==null)h+=`<div class="card danger"><b>Henüz yedek almadın.</b><div class="muted">Telefon bozulursa veya uygulama silinirse veriler gider.</div><button class="btn sm" style="margin-top:8px" data-act="go" data-p="backup">Yedek al</button></div>`;
    else if(days>=7||S.settings.sinceBackup>=5)h+=`<div class="card alert"><b>Yedek zamanı.</b><div class="muted">Son yedek ${days} gün önce, o zamandan beri ${S.settings.sinceBackup} yeni ziyaret.</div><button class="btn sm" style="margin-top:8px" data-act="go" data-p="backup">Yedek al</button></div>`;
  }
  h+=`<button class="btn full bigbtn" data-act="newVisitPick">+ Yeni ziyaret kaydı</button>`;
  // aramalar
  const calls=S.calls.filter(c=>!c.done&&c.tarih<=t).sort((a,b)=>a.tarih.localeCompare(b.tarih));
  h+=section('📞 Aranacak hastalar',calls.map(c=>{
    const p=patient(c.patientId),late=dayDiff(c.tarih,t);
    return `<div class="card danger item"><div class="grow" data-act="go" data-p="patient" data-id="${c.patientId}"><b>${esc(pname(p))}</b><div class="muted">${late>0?late+' gün gecikti':'Bugün aranacak'} · ziyaret sonrası kontrol</div>${p&&p.tel?`<a class="tel" href="tel:${esc(p.tel)}" onclick="event.stopPropagation()">${esc(p.tel)}</a>`:''}</div><button class="btn sm grn" data-act="callDone" data-id="${c.id}">Arandı</button></div>`;
  }));
  // planlar
  const plans=S.plans.filter(p=>!p.done).sort((a,b)=>(a.tarih+(a.saat||'')).localeCompare(b.tarih+(b.saat||'')));
  const planRow=(p,cls,lab)=>`<div class="card ${cls} item"><div class="grow" data-act="go" data-p="patient" data-id="${p.patientId}"><b>${esc(pname(patient(p.patientId)))}</b> <span class="badge ${cls==='danger'?'red':''}">${lab}</span><div class="muted">${fd(p.tarih)} ${esc(p.saat||'')} · ${esc(p.islem||'')}</div></div><button class="btn sm" data-act="planDo" data-id="${p.id}">Ziyaret yaptım</button></div>`;
  h+=section('⚠️ Yapılmamış planlar',plans.filter(p=>p.tarih<t).map(p=>planRow(p,'danger',dayDiff(p.tarih,t)+' gün geçti')));
  h+=section('📅 Bugünün planları',plans.filter(p=>p.tarih===t).map(p=>planRow(p,'alert','bugün')));
  h+=section('🗓 Önümüzdeki 7 gün',plans.filter(p=>p.tarih>t&&p.tarih<=addDays(t,7)).map(p=>planRow(p,'','+'+dayDiff(t,p.tarih)+' gün')));
  // stok uyarıları
  const low=S.stock.filter(i=>num(i.minAdet)>0&&num(i.adet)<=num(i.minAdet));
  h+=section('📦 Azalan stok',low.map(i=>`<div class="card alert item" data-act="stockEdit" data-id="${i.id}"><div class="grow"><b>${esc(i.ad)}</b></div><div class="red"><b>${i.adet}</b> <span class="muted">/ uyarı ${i.minAdet}</span></div></div>`));
  const exp=S.stock.filter(i=>i.skt&&num(i.adet)>0&&dayDiff(t,i.skt)<=num(S.settings.sktDays)).sort((a,b)=>a.skt.localeCompare(b.skt));
  h+=section('⏳ Son kullanma tarihi',exp.map(i=>{const d=dayDiff(t,i.skt);return `<div class="card ${d<0?'danger':'alert'} item" data-act="stockEdit" data-id="${i.id}"><div class="grow"><b>${esc(i.ad)}</b><div class="muted">SKT ${fd(i.skt)} · ${i.adet} adet</div></div><span class="badge ${d<0?'red':'org'}">${d<0?'geçti':d+' gün'}</span></div>`;}));
  // aylık özet
  h+=`<h2>${MN[m]} ${y} özeti</h2><div class="card"><div class="row"><div><div class="muted">Ziyaret</div><div class="big">${st.n}</div></div><div><div class="muted">Alınan ücret</div><div class="big" style="font-size:20px">${money(st.ucret)}</div></div></div><div style="margin-top:8px" class="muted">Net kâr</div><div class="big ${st.net<0?'red':'grn'}">${money(st.net)}</div>${st.labBorc>0?`<div class="muted" style="margin-top:6px">Ödenmemiş laboratuvar borcu: ${money(st.labBorc)}</div>`:''}</div>`;
  return {t:'Ana Sayfa',h};
}

function visitCard(v){

  <div class="muted">Maliyet ${money(c.maliyet)} · Kâr <span class="${c.kar<0?'red':'grn'}">${money(c.kar)}</span>${c.borc>0?` · <span class="red">Kalan borç ${money(c.borc)}</span>`:''}</div>
  ${v.sikayet?`<div class="muted">Şikâyet: ${esc(v.sikayet)}</div>`:''}${v.not?`<div class="muted">Not: ${esc(v.not)}</div>`:''}

function pPatient(){
  const p=patient(R.id);
  if(!p)return {t:'Hasta',back:1,h:'<div class="empty">Hasta bulunamadı</div>'};
  const vs=S.visits.filter(v=>v.patientId===p.id).sort((a,b)=>(b.tarih+(b.saat||'')).localeCompare(a.tarih+(a.saat||'')));
  let ucret=0,mal=0,borc=0;vs.forEach(v=>{const c=visitCalc(v);ucret+=num(v.ucret);mal+=c.maliyet;borc+=c.borc;});
  const a=ageOf(p.dogum);
  let h=`<div class="card"><div class="item"><div class="grow"><b style="font-size:19px">${esc(pname(p))}</b><div class="muted">${a!==''?a+' yaş · ':''}${p.dogum?fd(p.dogum):''}</div>${p.tel?`<a class="tel" href="tel:${esc(p.tel)}">📞 ${esc(p.tel)}</a>`:''}</div></div>${p.not?`<div class="note">⚠️ ${esc(p.not)}</div>`:''}</div>`;
  h+=`<div class="card sum"><table class="tb"><tr><td>Toplam ziyaret</td><td class="r">${vs.length}</td></tr><tr><td>Toplam ücret</td><td class="r">${money(ucret)}</td></tr><tr><td>Toplam maliyet</td><td class="r">${money(mal)}</td></tr><tr class="tot"><td>Kâr</td><td class="r ${ucret-mal<0?'red':'grn'}">${money(ucret-mal)}</td></tr><tr class="tot"><td>Kalan borç</td><td class="r ${borc>0?'red':''}">${money(borc)}</td></tr></table>${borc>0?`<button class="btn sm grn" style="margin-top:8px" data-act="pay" data-id="${p.id}">Ödeme al</button>`:''}</div>`;
  h+=`<div class="row" style="margin-bottom:10px"><button class="btn" data-act="visitNew" data-id="${p.id}">+ Ziyaret</button><button class="btn gray" data-act="planNew" data-id="${p.id}">+ Plan</button></div>`;
  const tabs=[['visits','Ziyaretler'],['plans','Planlar'],['files','Tahliller'],['info','Bilgiler']];
  h+=`<div class="seg">${tabs.map(t=>`<button class="${P.tab===t[0]?'on':''}" data-act="ptab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>`;
  if(P.tab==='visits')h+=vs.length?vs.map(visitCard).join(''):'<div class="empty">Henüz ziyaret yok</div>';
  if(P.tab==='plans'){
    const pl=S.plans.filter(x=>x.patientId===p.id).sort((a,b)=>b.tarih.localeCompare(a.tarih));
    const cl=S.calls.filter(c=>c.patientId===p.id&&!c.done);
    h+=cl.map(c=>`<div class="card danger item"><div class="grow"><b>📞 Hastayı ara</b><div class="muted">${fd(c.tarih)}</div></div><button class="btn sm grn" data-act="callDone" data-id="${c.id}">Arandı</button></div>`).join('');
    h+=pl.length?pl.map(x=>`<div class="card item"><div class="grow" data-act="planEdit" data-id="${x.id}"><b>${fd(x.tarih)} ${esc(x.saat||'')}</b> ${x.done?'<span class="badge grn">yapıldı</span>':''}<div class="muted">${esc(x.islem||'')}</div></div>${x.done?'':`<button class="btn sm" data-act="planDo" data-id="${x.id}">Ziyaret yaptım</button>`}</div>`).join(''):'<div class="empty">Planlanan işlem yok</div>';
  }
  if(P.tab==='files'){
    const fl=S.files.filter(f=>f.patientId===p.id).sort((a,b)=>b.tarih.localeCompare(a.tarih));
    h+=`<button class="btn full" data-act="fileAdd" data-id="${p.id}">+ Tahlil fotoğrafı / PDF ekle</button><input type="file" id="fileIn" accept="image/*,application/pdf" multiple style="display:none">`;
    h+=fl.length?fl.map(f=>`<div class="card item"><div class="grow" data-act="fileOpen" data-id="${f.id}"><b>${esc(f.ad)}</b><div class="muted">${fd(f.tarih)} · ${f.tip==='application/pdf'?'PDF':'Fotoğraf'}${f.not?' · '+esc(f.not):''}</div></div><button class="btn sm gray" data-act="fileEdit" data-id="${f.id}">Düzenle</button></div>`).join(''):'<div class="empty">Henüz tahlil dosyası yok</div>';
  }
  if(P.tab==='info'){
    const row=(l,v)=>v?`<tr><td class="muted">${l}</td><td>${esc(v)}</td></tr>`:'';
    h+=`<div class="card"><table class="tb">${row('Ad Soyad',pname(p))}${row('Doğum tarihi',fd(p.dogum))}${row('TC / Pasaport',p.tc)}${row('Telefon',p.tel)}${row('Adres',p.adres)}${row('Notlar',p.not)}</table></div><div class="row"><button class="btn" data-act="patEdit" data-id="${p.id}">Düzenle</button><button class="btn red" data-act="patDel" data-id="${p.id}">Hastayı sil</button></div>`;
  }
  return {t:pname(p),back:1,h};
}

function newV(pid,o){
  o=o||{};VQ='';
  return {patientId:pid,tarih:o.tarih||today(),saat:o.saat||nowTime(),kim:'ben',hizmetler:[],svcN:{},elle:false,items:[],tests:[],hizmetBedeli:'',ucret:'',odenen:'',ucretAuto:true,odenenAuto:true,hemsireUcret:'',labOdendi:true,sikayet:'',olcum:'',kontrol:'',not:o.not||'',planId:o.planId||null};
}
function labActive(){return V.hizmetler.some(id=>{const s=S.services.find(x=>x.id===id);return s&&s.tip==='lab';});}
function serumActive(){return V.hizmetler.some(id=>{const s=S.services.find(x=>x.id===id);return s&&s.tip==='serum';});}
function autoUcret(){
  let t=0;
  V.hizmetler.forEach(id=>{const s=S.services.find(x=>x.id===id);if(s&&s.tip!=='lab')t+=num(s.ucret)*((V.svcN||{})[id]||1);});
  if(labActive())t+=V.tests.reduce((a,x)=>a+num(x.satis),0)+num(V.hizmetBedeli);
  return round2(t);
}

/* ---------- Excel / CSV'den test listesi ---------- */
async function unzip(u8,want){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let e=-1;for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error('format');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={},td=new TextDecoder();
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)throw new Error('format');
    const method=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    if(!want(name))continue;
    const st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),data=u8.subarray(st,st+cs);
    let raw;
    if(method===0)raw=data;
    else if(method===8){
      if(typeof DecompressionStream==='undefined')throw new Error('nodecomp');
      raw=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    }else throw new Error('format');
    out[name]=td.decode(raw);
  }
  return out;
}
function csvSplit(l,sep){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}else if(ch==='"')q=true;else if(ch===sep){o.push(c);c='';}else c+=ch;}o.push(c);return o;}
async function readSheetRows(file){
  if(/\.csv$/i.test(file.name)||file.type==='text/csv'){
    const txt=(await file.text()).replace(/^﻿/,'').replace(/\r/g,''),first=txt.split('\n')[0];
    const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
    return txt.split('\n').map(l=>csvSplit(l,sep));
  }
  const files=await unzip(new Uint8Array(await file.arrayBuffer()),n=>n==='xl/sharedStrings.xml'||/^xl\/worksheets\/sheet\d+\.xml$/.test(n));
  const dp=new DOMParser();
  const ss=files['xl/sharedStrings.xml']?[...dp.parseFromString(files['xl/sharedStrings.xml'],'application/xml').getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
  const sh=Object.keys(files).filter(n=>n.includes('worksheets')).sort((a,b)=>parseInt(a.match(/(\d+)\.xml/)[1])-parseInt(b.match(/(\d+)\.xml/)[1]))[0];
  if(!sh)throw new Error('format');
  const colIdx=s=>{let n=0;for(const ch of s.toUpperCase())n=n*26+ch.charCodeAt(0)-64;return n-1;};
  const rows=[];
  for(const r of dp.parseFromString(files[sh],'application/xml').getElementsByTagName('row')){
    const arr=[];let pos=0;
    for(const c of r.getElementsByTagName('c')){
      const ref=(c.getAttribute('r')||'').replace(/\d+/g,'');const col=ref?colIdx(ref):pos;pos=col+1;
      const t=c.getAttribute('t'),ve=c.getElementsByTagName('v')[0];let v;
      if(t==='s')v=ss[+(ve?ve.textContent:-1)];
      else if(t==='inlineStr')v=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
      else{v=ve?ve.textContent:'';if(t!=='str'&&t!=='e'&&v!==''&&!isNaN(+v))v=+v;}
      arr[col]=v;
    }
    rows.push(arr);
  }
  return rows;
}
function parseTestRows(rows){
  let hi=-1,nc=-1,pc=-1,kc=-1;
  for(let i=0;i<Math.min(rows.length,30)&&hi<0;i++){
    const r=(rows[i]||[]).map(x=>fold(String(x==null?'':x)).trim());
    const n=r.findIndex(x=>/test|tahlil|analiz|ad[iı]?$/.test(x)),p=r.findIndex(x=>/fiyat|ucret|tutar/.test(x));
    if(n>=0&&p>=0){hi=i;nc=n;pc=p;kc=r.findIndex(x=>/^kod/.test(x));}
  }
  if(hi<0)throw new Error('header');
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]||[],ad=String(r[nc]==null?'':r[nc]).replace(/\s+/g,' ').trim();
    const f=typeof r[pc]==='number'?r[pc]:num(String(r[pc]==null?'':r[pc]).replace(/[^\d.,]/g,''));
    if(!ad||!(f>0))continue;
    out.push({kod:kc>=0?String(r[kc]==null?'':r[kc]).trim():'',ad,fiyat:round2(f)});
  }
  return out;
}
function matchTests(list){
  const cnt=(arr,k)=>arr.reduce((m,x)=>{if(x.kod)m[x.kod]=(m[x.kod]||0)+1;return m;},{});
  const nk=cnt(list),ok=cnt(S.tests);
  return list.map(x=>{
    let t=S.tests.find(t=>t.kod&&x.kod&&t.kod===x.kod&&fold(t.ad)===fold(x.ad));
    if(!t&&x.kod&&nk[x.kod]===1&&ok[x.kod]===1)t=S.tests.find(t=>t.kod===x.kod);
    if(!t)t=S.tests.find(t=>fold(t.ad)===fold(x.ad));
    return {x,t};
  });
}

/* ---------- Maliye ---------- */
function breakdown(s){
  const r=(l,v,c)=>`<tr class="${c||''}"><td>${l}</td><td class="r">${v}</td></tr>`;
  let h='<table class="tb">';
  h+=r('Ziyaret sayısı',s.n);
  h+=r('Alınan ücret',money(s.ucret));
  if(s.adjC)h+=r('&nbsp;&nbsp;(içinde elle düzeltme)',money(s.adjC),'sub');
  h+=r('&nbsp;&nbsp;Tahsil edilen',money(s.odenen),'sub');
  h+=r('&nbsp;&nbsp;Kalan borç (alacak)',money(s.borc),'sub');
  h+=r('Maliyetler','','hd');
  h+=r('İlaç ve malzeme (kullanılan)',money(s.ilac));
  h+=r('Laboratuvar gideri',money(s.lab));
  h+=r('Hemşire ödemeleri',money(s.hems));
  if(s.eski>0)h+=r('Eski kayıtlar (not defterinden)',money(s.eski));
  if(s.elle>0)h+=r('Elle girilen ziyaret maliyetleri',money(s.elle));
  if(s.adjM)h+=r('Elle düzeltme (maliyet)',money(s.adjM));
  allCats().forEach(c=>{h+=r(esc(c),money(s.gc[c]||0));});
  h+=r('Toplam maliyet',money(s.tmal),'tot');
  h+=r('Net kâr',money(s.net),'tot '+(s.net<0?'red':'grn'));
  h+=r('Karşılaştırma','','hd');
  h+=r('Satın alınan ilaç/malzeme',money(s.alim));
  h+=r('Ödenmemiş laboratuvar borcu',money(s.labBorc));
  if(s.infoHems)h+=r('Hemşirelere ödeme (zaten maliyette)',money(s.infoHems));
  if(s.infoLab)h+=r('ULTRALAB ödemesi (zaten maliyette)',money(s.infoLab));
  return h+'</table>';
}
function nurseStats(y,m){
  const inP=d=>{const yy=+d.slice(0,4),mm=+d.slice(5,7)-1;return (y==null||yy===y)&&(m==null||mm===m);};
  const o={};
  S.visits.filter(v=>isNurse(v)&&inP(v.tarih)).forEach(v=>{
    const n=o[v.kim]||(o[v.kim]={ad:(S.nurses.find(x=>x.id===v.kim)||{}).ad||v.kimAd||'Hemşire',n:0,t:0});
    n.n++;n.t+=num(v.hemsireUcret);
  });
  S.extPay.filter(e=>e.tip==='hemsire'&&inP(e.tarih)).forEach(e=>{
    const n=o['x:'+e.ad]||(o['x:'+e.ad]={ad:e.ad,n:0,t:0});n.t+=num(e.tutar);
  });
  return Object.values(o);
}
function pFin(){
  const cy=new Date().getFullYear();
  const ys=new Set([cy]);S.visits.forEach(v=>ys.add(+v.tarih.slice(0,4)));S.expenses.forEach(e=>ys.add(+e.tarih.slice(0,4)));
  const y=R.year||cy;ys.add(y);
  const rows=MN.map((n,i)=>periodStats(y,i)),tot=periodStats(y,null);
  const mx=Math.max(1,...rows.map(r=>Math.abs(r.net)));
  let h=`<label style="margin-top:0">Yıl<select id="finyear">${[...ys].sort((a,b)=>b-a).map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('')}</select></label>`;
  h+=`<h2>Aylar (satıra dokun)</h2><div class="card"><table class="tb"><tr><th>Ay</th><th class="r">Ziy.</th><th class="r">Ücret</th><th class="r">Maliyet</th><th class="r">Net kâr</th></tr>${rows.map((r,i)=>`<tr class="click" data-act="monthDetail" data-m="${i}"><td>${MN[i]}</td><td class="r">${r.n}</td><td class="r">${money(r.ucret)}</td><td class="r">${money(r.tmal)}</td><td class="r ${r.net<0?'red':''}"><b>${money(r.net)}</b></td></tr>`).join('')}<tr class="tot"><td>${y}</td><td class="r">${tot.n}</td><td class="r">${money(tot.ucret)}</td><td class="r">${money(tot.tmal)}</td><td class="r ${tot.net<0?'red':'grn'}">${money(tot.net)}</td></tr></table></div>`;
  h+=`<h2>Aylık net kâr</h2><div class="card"><div class="chart">${rows.map((r,i)=>{const ht=Math.round(Math.abs(r.net)/mx*56);return `<div class="col"><div class="up">${r.net>0?`<i style="height:${Math.max(ht,2)}px"></i>`:''}</div><div class="dn">${r.net<0?`<i class="neg" style="height:${Math.max(ht,2)}px"></i>`:''}</div><small>${MS[i]}</small></div>`;}).join('')}</div></div>`;
  h+=`<h2>${y} yıllık özet</h2><div class="card">${breakdown(tot)}</div>`;
  const ns_=nurseStats(y,null);
  h+=`<h2>Hemşire ödemeleri (${y})</h2><div class="card">${ns_.length?`<table class="tb"><tr><th>Hemşire</th><th class="r">Ziyaret</th><th class="r">Ödenen</th></tr>${ns_.map(n=>`<tr><td>${esc(n.ad)}</td><td class="r">${n.n}</td><td class="r">${money(n.t)}</td></tr>`).join('')}</table>`:'<div class="empty">Hemşire ziyareti yok</div>'}</div>`;
  const lb=S.visits.filter(v=>visitCalc(v).labCost>0&&!v.labOdendi).sort((a,b)=>a.tarih.localeCompare(b.tarih));
  if(lb.length)h+=`<h2>Ödenmemiş laboratuvar</h2>${lb.map(v=>`<div class="card item"><div class="grow"><b>${esc(pname(patient(v.patientId)))}</b><div class="muted">${fd(v.tarih)} · ${money(visitCalc(v).labCost)}</div></div><button class="btn sm grn" data-act="labPaid" data-id="${v.id}">Ödendi</button></div>`).join('')}`;
  h+=`<button class="btn full gray" style="margin-top:12px" data-act="csv">📄 ${y} tablosunu Excel (CSV) olarak al</button>`;
  return {t:'Maliye',h};
}
function monthDetail(m){
  const y=R.year||new Date().getFullYear();
  const s=periodStats(y,m);
  const vs=S.visits.filter(v=>+v.tarih.slice(0,4)===y&&+v.tarih.slice(5,7)-1===m).sort((a,b)=>a.tarih.localeCompare(b.tarih));
  const nsx=nurseStats(y,m);
  modal(`<h3>${MN[m]} ${y}</h3>${breakdown(s)}${nsx.length?`<h2>Hemşireler</h2><table class="tb">${nsx.map(n=>`<tr><td>${esc(n.ad)}</td><td class="r">${n.n} ziyaret</td><td class="r">${money(n.t)}</td></tr>`).join('')}</table>`:''}<h2>Elle düzeltmeler</h2>${adjHtml(y,m)}<button class="btn gray full" data-act="adjNew" data-m="${m}">+ Düzeltme ekle</button><h2>Ziyaretler</h2>${vs.length?`<table class="tb">${vs.map(v=>{const c=visitCalc(v);return `<tr><td>${fd(v.tarih).slice(0,5)}</td><td>${esc(pname(patient(v.patientId)))}</td><td class="r">${money(v.ucret)}</td><td class="r ${c.kar<0?'red':'grn'}">${money(c.kar)}</td></tr>`;}).join('')}</table>`:'<div class="empty">Ziyaret yok</div>'}<div class="btns"><button class="btn" data-act="m-close">Kapat</button></div>`);
}
function adjHtml(y,m){
  const L=S.adj.filter(a=>+a.tarih.slice(0,4)===y&&+a.tarih.slice(5,7)-1===m);
  return L.length?L.map(a=>`<div class="item" data-act="adjEdit" data-id="${a.id}" style="margin-bottom:6px"><div class="grow">${fd(a.tarih)}${a.not?' · '+esc(a.not):''}<div class="muted">Ciro ${num(a.ciro)>=0?'+':''}${money(a.ciro)} · Maliyet ${num(a.maliyet)>=0?'+':''}${money(a.maliyet)}</div></div><div class="muted">›</div></div>`).join(''):'<div class="muted">Yok. Ay toplamı yanlışsa buradan fark ekle (eksi de yazabilirsin).</div>';
}
function adjForm(a,m){
  const y=R.year||new Date().getFullYear();
  openForm({title:a?'Düzeltmeyi düzenle':'Aylık düzeltme',
    note:'Ay toplamına <b>eklenecek fark</b>. Fazla yazılmışsa eksi yaz (örn. -500). Ziyaretler değişmez.',
    fields:[{k:'tarih',label:'Tarih',type:'date',value:a?a.tarih:(y+'-'+String(m+1).padStart(2,'0')+'-01')},{k:'ciro',label:'Ciro farkı (TL)',value:a&&String(a.ciro)},{k:'maliyet',label:'Maliyet farkı (TL)',value:a&&String(a.maliyet)},{k:'not',label:'Not',value:a&&a.not}],
    onDelete:a?()=>{if(!confirm('Düzeltme silinsin mi?'))return;S.adj=S.adj.filter(x=>x.id!==a.id);save();closeModal();render(true);}:null,
    onSave:v=>{
      const c=parseFloat(String(v.ciro||'0').replace(',','.'))||0,mm=parseFloat(String(v.maliyet||'0').replace(',','.'))||0;
      if(!v.tarih||(!c&&!mm)){toast('Tarih ve en az bir tutar yaz');return false;}
      const o={tarih:v.tarih,ciro:c,maliyet:mm,not:v.not};
      if(a)Object.assign(a,o);else S.adj.push(Object.assign({id:uid()},o));
      save();render(true);
    }});
}
function payList(tip,ad){
  const L=S.extPay.filter(e=>e.tip===tip&&(!ad||e.ad===ad)).sort((a,b)=>b.tarih.localeCompare(a.tarih));
  const tot=L.reduce((a,e)=>a+num(e.tutar),0);
  return `<div class="muted">Toplam: <b>${money(tot)}</b></div>`+(L.length?L.map(e=>`<div class="card item" data-act="payEdit" data-id="${e.id}"><div class="grow"><b>${tip==='hemsire'?esc(e.ad):'ULTRALAB'}</b><div class="muted">${fd(e.tarih)}${e.dahil?' · maliyette zaten var':' · maliyete eklenir'}${e.not?' · '+esc(e.not):''}</div></div><b>${money(e.tutar)}</b></div>`).join(''):'<div class="empty">Kayıt yok</div>');
}
function payForm(tip,e){
  const f=[{k:'tarih',label:'Tarih',type:'date',value:e?e.tarih:today()}];
  if(tip==='hemsire')f.push({k:'ad',label:'Hemşire adı',value:e?e.ad:''});
  f.push({k:'tutar',label:'Ödenen tutar (TL)',type:'num',value:e&&ns(e.tutar)});
  f.push({k:'dahil',label:'Bu ödeme ziyaret maliyetlerinde zaten var mı?',type:'select',options:[['1','Evet, sadece kayıt olarak göster'],['0','Hayır, maliyete ekle']],value:e?(e.dahil?'1':'0'):'1'});
  f.push({k:'not',label:'Not',value:e&&e.not});
  openForm({title:(tip==='hemsire'?'Hemşire ödemesi':'ULTRALAB ödemesi')+(e?' (düzenle)':''),
    note:'Eski ziyaretleri not defterinden aktardıysan maliyetler zaten içindedir: "Evet" bırak. Ziyaret kaydı olmayan bir ödeme ise "Hayır" seç, aylık maliyete eklenir.',
    fields:f,
    onDelete:e?()=>{if(!confirm('Ödeme silinsin mi?'))return;S.extPay=S.extPay.filter(x=>x.id!==e.id);save();closeModal();render(true);}:null,
    onSave:v=>{
      if(!v.tarih||num(v.tutar)<=0){toast('Tarih ve tutar gerekli');return false;}
      if(tip==='hemsire'&&!v.ad){toast('Hemşire adı yaz');return false;}
      const o={tip,tarih:v.tarih,ad:tip==='hemsire'?v.ad:'ULTRALAB',tutar:num(v.tutar),dahil:v.dahil==='1',not:v.not};
      if(e)Object.assign(e,o);else S.extPay.push(Object.assign({id:uid()},o));
      save();render(true);
    }});
}
function csvYear(y){
  const cats=allCats();
  const head=['Ay','Ziyaret','Alınan ücret','Tahsil edilen','İlaç-malzeme','Laboratuvar','Hemşire','Eski kayıt maliyeti','Elle maliyet','Elle düzeltme (maliyet)',...cats,'Toplam maliyet','Net kâr','Stok alımı'];
  const f=n=>String(round2(n)).replace('.',',');
  const line=(lab,s)=>[lab,s.n,f(s.ucret),f(s.odenen),f(s.ilac),f(s.lab),f(s.hems),f(s.eski),f(s.elle),f(s.adjM),...cats.map(c=>f(s.gc[c]||0)),f(s.tmal),f(s.net),f(s.alim)];
  const rows=[head,...MN.map((n,i)=>line(n,periodStats(y,i))),line('TOPLAM '+y,periodStats(y,null))];
  return '﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
}

/* ---------- Notlardan içe aktarma ---------- */
let IM={text:'',items:null,cmp:null,pays:[]};
// Hizmet satırı başlangıçları (küçük harfe çevrilmiş satırda aranır)
const SERV_L=/^(serum|[iı]zotonik|ringer|dekstroz|[iı]zolen|kan\b|enj|[iı][ğg]ne\b|pansuman|sonda|lavman|nebul|tansiyon|şeker(?=\s|$)|ateş(?=\s|$)|aşı(?=\s|$)|ekg|ecg|oksijen|dikiş|sütür|damar|(?:eczane\s*)?[iı]la[çc](?=\s|$)|[iı]nhaler(?=\s|$))/;
// Sadece ilaç ekleyen satırlar (hizmet sayılmaz): "İlaç", "Eczane İlaç", "İnhaler"
const ITEM_L=/^(?:(?:eczane\s*)?[iı]la[çc]|[iı]nhaler)(?=\s|$)/;
const SERUMNAME_L=/^(serum|[iı]zotonik|ringer|dekstroz|[iı]zolen)/;
const isServ=L=>SERV_L.test(lc(L).replace(/^\s+/,''));
const isItemLine=L=>ITEM_L.test(lc(L).replace(/^\s+/,''));
// Tarih satırı: tarihten sonra ✅ ❌ ‼️ nokta veya rakamsız kısa not olabilir
const DATE_RX=/^(\d{1,2})\.(\d{1,2})\.(\d{4})\.?\s*(?:-\s*)?(?:(\d{1,2})[.:](\d{2})(?!\d))?([^\d]*)$/;
const PHONE_RX=/(?<!\d)0?5\d{2}[\s.-]?\d{3}[\s.-]?\d{2}[\s.-]?\d{2}(?!\d)/;
const UC_RX=/al[ıiIİ]nan\s*[üuÜU]cret\s*[-:–]?\s*([\d.,]*\d)/i;
const MAL_RX=/^mal[iıİI]yet\s*[-:–]?\s*([\d.,]*\d)/i;
// Ziyaret altındaki maliyet / ücret / kâr satırı (tutar boş olabilir)
const COST_RX=/^(mal[iıİI]yet|al[ıiIİ]nan\s*[üuÜU]cret|k[aâ]r)(?=\s*[-:–]|\s*\d|\s*₺|\s*$)\s*[-:–]?\s*([\d.,]*\d)?\s*(?:₺|tl)?\.?\s*(.*)$/i;
// Maliyet satırındaki hemşire parantezi: (MUSTAFA BOZDOĞAN-700₺) veya (SEDA-300)
const NURSE_PAR_RX=/\(\s*([A-Za-zÇĞİÖŞÜçğıöşü][A-Za-zÇĞİÖŞÜçğıöşü.' ]*?)\s*[-:–=]?\s*(\d[\d.,]*)\s*(?:₺|tl)?\s*\)/i;

    for(let j=Math.max(0,i-8);j<=Math.min(out.length-1,i+8);j++){if(j!==i&&ym0[j]!=null)nb.push(ym0[j]);}
    if(nb.length<3)return;
    const cnt={};nb.forEach(b=>cnt[b]=(cnt[b]||0)+1);
    const mode=+Object.keys(cnt).sort((p,q)=>cnt[q]-cnt[p])[0];
    const diff=a-mode;
    if(diff!==0&&diff%12===0&&cnt[mode]>=nb.length/2){
      const yOld=+x.tarih.slice(0,4),yNew=yOld-diff/12;
      x.tarih=yNew+x.tarih.slice(4);
      x.fix.push('Yıl defterde '+yOld+' yazılmış, '+yNew+' olarak düzeltildi');
      if(x.anon)x.soyad=x.soyad.replace(/\d{2}\.\d{2}\.\d{4}/,fd(x.tarih));
      if(x.ref)x.soyad=x.soyad.replace(/\d{2}\.\d{2}\.\d{4}/,fd(x.tarih));
      return;
    }
    const near=nb.filter(b=>Math.abs(a-b)<=2).length;
    if(near<nb.length/2){x.w.push({k:'t',m:'Tarih komşu kayıtlardan çok farklı, kontrol et'});return;}
    let pv=null,nv=null;
    for(let j=i-1;j>=0;j--)if(ym0[j]!=null){pv=ym0[j];break;}
    for(let j=i+1;j<out.length;j++)if(ym0[j]!=null){nv=ym0[j];break;}
    if(pv!=null&&pv===nv&&pv!==a)x.w.push({k:'t',m:'Önceki ve sonraki kayıtlar '+ymTxt(pv)+', bu kayıt '+ymTxt(a)+'. Yazım hatası olabilir, kontrol et'});
  });
  // hasta eşleştirme ve tekrar kontrolü
  const seen=new Set(),usedDup=new Set();
  out.forEach(x=>{
    const ex=matchPatient(x),keys=patKeys(x);
    x.mark=ex?'mevcut hasta':(keys.some(k=>seen.has(k))?'bu aktarımda':'yeni hasta');
    keys.forEach(k=>seen.add(k));
    if(ex&&x.tarih){
      const dv=S.visits.find(v=>v.patientId===ex.id&&v.eski&&v.tarih===x.tarih&&!usedDup.has(v.id)&&Math.abs(num(v.ucret)-x.ucret)<0.01&&Math.abs(num(v.maliyet)-x.maliyet)<0.01);
      if(dv){usedDup.add(dv.id);x.w.push({k:'d',m:'Aynı hasta, tarih ve ücretle daha önce aktarılmış, tekrar eklenmesin diye seçilmedi'});}
    }
    x.include=x.w.length===0;
  });
  const gotU=round2(out.reduce((a,x)=>a+x.ucret,0)),gotM=round2(out.reduce((a,x)=>a+x.maliyet,0));
  const cmp=totals.found?{fileU:totals.u,fileM:totals.m,gotU,gotM,ok:Math.abs(totals.u-gotU)<1&&Math.abs(totals.m-gotM)<1}:null;
  pays.forEach(y=>{
    y.dahil=true;
    if(y.tip==='hemsire'){
      const k=nkey(y.ad),mo=y.tarih.slice(0,7);
      const fromV=round2(out.filter(x=>x.kimAd&&nkey(x.kimAd)===k&&x.tarih&&x.tarih.slice(0,7)===mo).reduce((a,x)=>a+x.hemsireUcret,0));
      if(fromV>0){
        y.include=false;
        y.note=Math.abs(fromV-y.tutar)<1?'Ziyaretlerde hemşire ücreti olarak zaten var, ayrıca eklenmesine gerek yok':'Ziyaretlerdeki hemşire ücreti '+money(fromV)+', burada '+money(y.tutar)+'. Farkı kontrol et';
        return;
      }
    }
    const dup=S.extPay.some(e=>e.tip===y.tip&&e.ad===y.ad&&e.tarih.slice(0,7)===y.tarih.slice(0,7)&&Math.abs(num(e.tutar)-y.tutar)<0.01);
    y.include=y.known&&!dup;
    y.note=!y.known?'İsim tanınmadı: hemşire ise işaretle':(dup?'Aynı ödeme zaten kayıtlı':'');
  });
  return {items:out,cmp,pays};
}

const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);};
const unb64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function makeBackup(pw){
  const files=[];
  for(const f of S.files){const b=await fGet(f.id);if(b)files.push({id:f.id,type:b.type,data:b64(new Uint8Array(await b.arrayBuffer()))});}
  const json=JSON.stringify({app:'hastatakip',ver:1,at:new Date().toISOString(),state:S,files});
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pw,salt);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(json)));
  return new Blob([JSON.stringify({m:'HT1',s:b64(salt),i:b64(iv),d:b64(ct)})],{type:'application/json'});
}
async function restoreBackup(file,pw){
  const o=JSON.parse(await file.text());
  if(o.m!=='HT1')throw new Error('format');
  const key=await deriveKey(pw,unb64(o.s));
  let plain;
  try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.i)},key,unb64(o.d));}catch(e){throw new Error('pw');}
  const p=JSON.parse(new TextDecoder().decode(plain));
  if(!p.state)throw new Error('format');
  await fClear();
  for(const f of p.files||[])await fPut(f.id,new Blob([unb64(f.data)],{type:f.type}));
  S=ensureShape(p.state);
  await kvSet('state',S);
}
async function saveFile(blob,name){
  const f=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title:name});return true;}catch(e){if(e&&e.name==='AbortError')return false;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);return true;
}

async function shrink(file){
  if(!String(file.type).startsWith('image/'))return file;
  try{
    const bmp=await createImageBitmap(file),sc=Math.min(1,1800/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
    return b||file;
  }catch(e){return file;}
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset,el);}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.v!==undefined&&t.tagName!=='SELECT'&&!(t.type==='date'&&false)){vInput(t);return;}
  if(t.id==='pk_q')pkRender();
  if(t.id==='im_text')IM.text=t.value;
  if(t.id==='ps_q'){$('#ps_l').innerHTML=plist(t.value,'page');}
  if(t.id==='lab_q'){R.lq=t.value;$('#lab_l').innerHTML=labList(t.value);}
  if(t.id==='vt_q'){VQ=t.value;$('#vt_l').innerHTML=vtList();}
  if(t.id==='gd_q'&&GD){GD.q=t.value;$('#gd_l').innerHTML=gdList();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.v==='kim'){V.kim=t.value;const n=S.nurses.find(x=>x.id===t.value);V.kimAd=n?n.ad:'';render(true);return;}
  if(t.id==='finyear'){R.year=+t.value;render(true);}
  if(t.id==='expyear'){R.year=+t.value;render(true);}
  if(t.id==='sv_tip'){svcSync();}
});

(async function init(){
  try{db=await idb();}catch(e){document.body.innerHTML='<p style="padding:20px">Bu tarayıcıda veri saklama kullanılamıyor. Safari\'de özel gezinme kapalı olmalı.</p>';return;}
  try{S=await kvGet('state');}catch(e){S=null;}
  if(!S){S=defaults();await kvSet('state',S);}
  ensureShape(S);
  if(!S.settings.m15){S.settings.m15=1;if(!S.expCats.includes('Avukatlık ücreti')){const i=S.expCats.indexOf('Diğer');if(i>=0)S.expCats.splice(i,0,'Avukatlık ücreti');else S.expCats.push('Avukatlık ücreti');}await kvSet('state',S);}
  // 1.8: daha önce kesirli (0,5 gibi) kaydedilen ilaçlar: uygulanan miktar korunur, düşen adet tama yuvarlanır
  if(!S.settings.m18){S.settings.m18=1;S.visits.forEach(v=>(v.items||[]).forEach(i=>{const a=num(i.adet);if(a>0&&Math.abs(a-Math.round(a))>1e-9){i.uyg=round2(a);i.adet=Math.ceil(a);}}));await kvSet('state',S);}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  render();
})();
</script>
</body>
</html>
